version: '3.8'

networks:
  sovereign-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── Shared defaults ─────────────────────────────────────────────────
x-service-defaults: &defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 2G
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sovereign-postgres
    <<: *defaults
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: keeper
      POSTGRES_PASSWORD: "${DB_PASSWORD:-localdev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeper -d sovereign"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.2

  redis:
    image: redis:7-alpine
    container_name: sovereign-redis
    <<: *defaults
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.4

  ollama:
    image: ollama/ollama:latest
    container_name: sovereign-ollama
    <<: *defaults
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.11

  ollama-pull:
    image: ollama/ollama:latest
    container_name: sovereign-ollama-pull
    restart: "no"
    entrypoint: ["sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b} && OLLAMA_HOST=ollama:11434 ollama pull ${EMBEDDING_OLLAMA_MODEL:-all-minilm}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.13

  tool-gate:
    build:
      context: .
      dockerfile: tool-gate/Dockerfile
    container_name: sovereign-tool-gate
    <<: *defaults
    environment:
      MODE: "PUB"
      REQUIRED_CONVICTION: "7.0"
      NONCE_TTL_SECONDS: "300"
      HMAC_ALLOW_DEV_SECRET: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.3
    depends_on:
      postgres:
        condition: service_healthy

  memu-core:
    build:
      context: .
      dockerfile: memu-core/Dockerfile
    container_name: sovereign-memu-core
    <<: *defaults
    environment:
      MEMU_URL: http://memu-core:8001
      MAX_MEMORY_RECORDS: "5000"
      VECTOR_STORE: turbovec
      PG_URI: "postgresql://keeper:${DB_PASSWORD:-localdev}@postgres:5432/sovereign"
      TURBOVEC_INDEX_PATH: /data/turbovec/memories.tv
      # default false (real model or crash, per DECISIONS.md) — CI overrides
      # to true since it's exercising spine/gate logic, not embedding quality
      MEMU_ALLOW_FAKE_EMBEDDINGS: "${MEMU_ALLOW_FAKE_EMBEDDINGS:-false}"
    volumes:
      - turbovec_data:/data/turbovec
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  memu-core-introspect:
    build:
      context: .
      dockerfile: memu-core/Dockerfile.introspect
    container_name: sovereign-memu-core-introspect
    <<: *defaults
    environment:
      VECTOR_STORE: turbovec
      PG_URI: "postgresql://keeper:${DB_PASSWORD:-localdev}@postgres:5432/sovereign"
      TURBOVEC_INDEX_PATH: /data/turbovec/memories.tv
      MEMU_ALLOW_FAKE_EMBEDDINGS: "${MEMU_ALLOW_FAKE_EMBEDDINGS:-false}"
    volumes:
      - turbovec_data:/data/turbovec
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8009/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.14
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  agentic:
    build:
      context: .
      dockerfile: agentic/Dockerfile
    container_name: sovereign-agentic
    <<: *defaults
    environment:
      MEMU_URL: http://memu-core:8001
      TOOL_GATE_URL: http://tool-gate:8000
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      LLM_TIMEOUT: "120"
      WAKE_URL: http://wake-service:8022
      FF_WAKE_INTENT_ROUTING: "${FF_WAKE_INTENT_ROUTING:-false}"
      HMAC_ALLOW_DEV_SECRET: "true"
      SKILL_HUNTER_URL: http://skill-hunter:8045
      HOUSE_DOCTOR_URL: http://house-doctor:8046
      VAULT_SYNC_URL: http://vault-sync:8047
      CORTEX_URL: http://cortex:8048
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.12
    depends_on:
      memu-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  heartbeat:
    build:
      context: .
      dockerfile: heartbeat/Dockerfile
    container_name: sovereign-heartbeat
    <<: *defaults
    environment:
      MEMU_INTROSPECT_URL: http://memu-core-introspect:8009
      CHECK_INTERVAL: "60"
      ALERT_WINDOW: "300"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.6
    depends_on:
      memu-core:
        condition: service_healthy
      memu-core-introspect:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sovereign-dashboard
    <<: *defaults
    environment:
      TOOL_GATE_URL: http://tool-gate:8000
      MEMU_URL: http://memu-core:8001
      MEMU_INTROSPECT_URL: http://memu-core-introspect:8009
      HEARTBEAT_URL: http://heartbeat:8010
      SUPERVISOR_URL: http://supervisor:8051
      WAKE_URL: http://wake-service:8022
      AUDIO_SERVICE_URL: http://audio-service:8021
      TTS_SERVICE_URL: http://tts-service:8030
      BROWSER_AGENT_URL: http://browser-agent:8040
      VISION_SERVICE_URL: http://vision-service:8023
      CLIPBOARD_SERVICE_URL: http://clipboard-service:8024
      FILES_SERVICE_URL: http://files-service:8025
      NOTIFY_SERVICE_URL: http://notify-service:8031
      DOC_PARSER_URL: http://document-parser:8032
      MONITOR_SERVICE_URL: http://monitor-service:8033
      BROKER_URL: http://broker-bridge:8034
      SYSMETRICS_URL: http://sysmetrics:8035
      SCREEN_WATCHER_URL: http://screen-watcher:8036
      EMAIL_READER_URL: http://email-reader:8037
      NEWS_FEED_URL: http://news-feed:8038
      WEATHER_SERVICE_URL: http://weather-service:8039
      DOCKER_WATCHER_URL: http://docker-watcher:8041
      AIRQUALITY_URL: http://airquality-service:8042
      CALENDAR_SERVICE_URL: http://calendar-service:8043
      GIT_WATCHER_URL: http://git-watcher:8044
      LANGGRAPH_URL: http://agentic:8007
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.7
    depends_on:
      tool-gate:
        condition: service_healthy
      memu-core:
        condition: service_healthy
      memu-core-introspect:
        condition: service_healthy
      heartbeat:
        condition: service_healthy
      tts-service:
        condition: service_started
      notify-service:
        condition: service_started
      document-parser:
        condition: service_started
      agentic:
        condition: service_started

  audio-service:
    profiles: ["sensors"]
    build:
      context: .
      dockerfile: perception/audio/Dockerfile
    container_name: sovereign-audio-service
    <<: *defaults
    environment:
      WHISPER_BACKEND: "${WHISPER_BACKEND:-stub}"
      WHISPER_MODEL: "${WHISPER_MODEL:-tiny}"
      MEMU_URL: http://memu-core:8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8021/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.15
    depends_on:
      memu-core:
        condition: service_healthy

  tts-service:
    build:
      context: .
      dockerfile: output/tts/Dockerfile
    container_name: sovereign-tts-service
    <<: *defaults
    environment:
      TTS_BACKEND: "${TTS_BACKEND:-edge}"
      TTS_VOICE: "${TTS_VOICE:-en-GB-RyanNeural}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8030/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.16

  browser-agent:
    profiles: ["external-egress"]
    build:
      context: .
      dockerfile: browser-agent/Dockerfile
    container_name: sovereign-browser-agent
    <<: *defaults
    environment:
      BROWSER_HEADLESS: "true"
      NAV_TIMEOUT_MS: "${NAV_TIMEOUT_MS:-20000}"
      MAX_SCRAPE_CHARS: "${MAX_SCRAPE_CHARS:-50000}"
      FF_BROWSER_AGENT: "${FF_BROWSER_AGENT:-false}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8040/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.17

  vision-service:
    profiles: ["sensors"]
    build:
      context: .
      dockerfile: perception/vision/Dockerfile
    container_name: sovereign-vision-service
    <<: *defaults
    environment:
      MIN_FACE_SIZE: "${MIN_FACE_SIZE:-30}"
      VISION_BACKEND: "${VISION_BACKEND:-opencv}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8023/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.18

  clipboard-service:
    profiles: ["sensors"]
    build:
      context: .
      dockerfile: perception/clipboard/Dockerfile
    container_name: sovereign-clipboard-service
    <<: *defaults
    environment:
      CLIPBOARD_MAX_HISTORY: "${CLIPBOARD_MAX_HISTORY:-50}"
      CLIPBOARD_MAX_BYTES: "${CLIPBOARD_MAX_BYTES:-262144}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8024/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.19

  files-service:
    profiles: ["sensors"]
    build:
      context: .
      dockerfile: perception/files/Dockerfile
    container_name: sovereign-files-service
    <<: *defaults
    environment:
      WATCH_DIRS: "${WATCH_DIRS:-}"
      FILES_MAX_EVENTS: "${FILES_MAX_EVENTS:-200}"
    volumes:
      - "${WATCH_ROOT:-/tmp}:/watched:ro"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8025/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.20

  notify-service:
    build:
      context: .
      dockerfile: output/notify/Dockerfile
    container_name: sovereign-notify-service
    <<: *defaults
    environment:
      NOTIFY_MAX_PENDING: "${NOTIFY_MAX_PENDING:-100}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8031/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.21

  document-parser:
    build:
      context: .
      dockerfile: document-parser/Dockerfile
    container_name: sovereign-document-parser
    <<: *defaults
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8032/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.22

  monitor-service:
    profiles: ["watchers"]
    build:
      context: .
      dockerfile: monitor-service/Dockerfile
    container_name: sovereign-monitor-service
    <<: *defaults
    environment:
      BROWSER_AGENT_URL: http://browser-agent:8040
      NOTIFY_SERVICE_URL: http://notify-service:8031
      TTS_SERVICE_URL: http://tts-service:8030
      RULES_FILE: "${MONITOR_RULES_FILE:-}"
      MONITOR_MAX_ALERTS: "${MONITOR_MAX_ALERTS:-200}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8033/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.23

  broker-bridge:
    profiles: ["finance"]
    build:
      context: .
      dockerfile: broker-bridge/Dockerfile
    container_name: sovereign-broker-bridge
    <<: *defaults
    environment:
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      BINANCE_MODE: "${BINANCE_MODE:-spot}"
      BINANCE_BASE_URL: "${BINANCE_BASE_URL:-https://api.binance.com}"
      BINANCE_FAPI_URL: "${BINANCE_FAPI_URL:-https://fapi.binance.com}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8034/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.24

  sysmetrics:
    profiles: ["watchers"]
    build:
      context: .
      dockerfile: sysmetrics/Dockerfile
    container_name: sovereign-sysmetrics
    <<: *defaults
    environment:
      TOP_PROCESSES: "${TOP_PROCESSES:-20}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8035/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.25

  screen-watcher:
    profiles: ["sensors"]
    build:
      context: .
      dockerfile: screen-watcher/Dockerfile
    container_name: sovereign-screen-watcher
    <<: *defaults
    environment:
      SCREEN_CAPTURE_URL: http://screen-capture:8020
      NOTIFY_SERVICE_URL: http://notify-service:8031
      TTS_SERVICE_URL: http://tts-service:8030
      WATCH_INTERVAL_SECONDS: "${WATCH_INTERVAL_SECONDS:-10}"
      CHANGE_THRESHOLD: "${CHANGE_THRESHOLD:-0.05}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8036/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.26

  email-reader:
    profiles: ["external-egress"]
    build:
      context: .
      dockerfile: email-reader/Dockerfile
    container_name: sovereign-email-reader
    <<: *defaults
    environment:
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-993}"
      MAIL_USER: "${MAIL_USER:-}"
      MAIL_PASS: "${MAIL_PASS:-}"
      EMAIL_POLL_INTERVAL_SECONDS: "${EMAIL_POLL_INTERVAL_SECONDS:-120}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8037/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.27

  news-feed:
    profiles: ["external-egress"]
    build:
      context: .
      dockerfile: news-feed/Dockerfile
    container_name: sovereign-news-feed
    <<: *defaults
    environment:
      REFRESH_INTERVAL_SECONDS: "${NEWS_REFRESH_INTERVAL:-300}"
      SEED_FEEDS: "${SEED_FEEDS:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8038/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.28

  weather-service:
    build:
      context: .
      dockerfile: weather-service/Dockerfile
    container_name: sovereign-weather-service
    <<: *defaults
    environment:
      WEATHER_LAT: "${WEATHER_LAT:-51.5074}"
      WEATHER_LON: "${WEATHER_LON:--0.1278}"
      WEATHER_LOCATION: "${WEATHER_LOCATION:-London}"
      WEATHER_REFRESH_SECONDS: "${WEATHER_REFRESH_SECONDS:-600}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8039/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.29

  docker-watcher:
    profiles: ["watchers"]
    build:
      context: .
      dockerfile: docker-watcher/Dockerfile
    container_name: sovereign-docker-watcher
    <<: *defaults
    environment:
      DOCKER_REFRESH_SECONDS: "${DOCKER_REFRESH_SECONDS:-30}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8041/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.30

  airquality-service:
    build:
      context: .
      dockerfile: airquality-service/Dockerfile
    container_name: sovereign-airquality-service
    <<: *defaults
    environment:
      WEATHER_LAT: "${WEATHER_LAT:-51.5074}"
      WEATHER_LON: "${WEATHER_LON:--0.1278}"
      WEATHER_LOCATION: "${WEATHER_LOCATION:-London}"
      AQ_REFRESH_SECONDS: "${AQ_REFRESH_SECONDS:-1800}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8042/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.31

  calendar-service:
    build:
      context: .
      dockerfile: calendar-service/Dockerfile
    container_name: sovereign-calendar-service
    <<: *defaults
    environment:
      CALDAV_URL: "${CALDAV_URL:-}"
      CALDAV_USER: "${CALDAV_USER:-}"
      CALDAV_PASS: "${CALDAV_PASS:-}"
      CALDAV_REFRESH_SECONDS: "${CALDAV_REFRESH_SECONDS:-300}"
      CALDAV_LOOK_AHEAD_DAYS: "${CALDAV_LOOK_AHEAD_DAYS:-14}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8043/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.32

  git-watcher:
    profiles: ["watchers"]
    build:
      context: .
      dockerfile: git-watcher/Dockerfile
    container_name: kai-git-watcher
    restart: unless-stopped
    environment:
      PORT: "8044"
      GIT_WATCH_PATHS: "/workspace"
      GIT_REFRESH_SECONDS: "60"
    volumes:
      - /home/user/kai-system:/workspace:ro
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.33


  skill-hunter:
    build:
      context: .
      dockerfile: skill-hunter/Dockerfile
    container_name: kai-skill-hunter
    restart: unless-stopped
    environment:
      PORT: "8045"
      SKILLS_DIR: "/data/skills"
    volumes:
      - soul_data:/data
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.34
    depends_on:
      - dashboard

  house-doctor:
    build:
      context: .
      dockerfile: house-doctor/Dockerfile
    container_name: kai-house-doctor
    restart: unless-stopped
    environment:
      MEMU_URL: http://memu-core:8001
      NOTIFY_URL: http://notify-service:8031
    volumes:
      - soul_data:/data
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.35
    depends_on:
      memu-core:
        condition: service_healthy

  vault-sync:
    profiles: ["vault"]
    build:
      context: .
      dockerfile: vault-sync/Dockerfile
    container_name: kai-vault-sync
    restart: unless-stopped
    environment:
      VAULT_PATH: /vault
      MEMU_CORE_URL: http://memu-core:8001
      TOOL_GATE_URL: http://tool-gate:8000
      FF_VAULT_SYNC: "true"
      VAULT_WRITE_CONVICTION_THRESHOLD: "9.0"
    volumes:
      - vault_data:/vault
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.36
    depends_on:
      memu-core:
        condition: service_healthy

  cortex:
    profiles: ["introspection"]
    build:
      context: .
      dockerfile: cortex/Dockerfile
    container_name: kai-cortex
    restart: unless-stopped
    environment:
      FF_CORTEX: "true"
      FF_CORTEX_VERBOSE: "false"
      CORTEX_REFRESH_INTERVAL: "60"
      WEATHER_SERVICE_URL: http://weather-service:8039
      AIRQUALITY_URL: http://airquality-service:8042
      CALENDAR_SERVICE_URL: http://calendar-service:8043
      DOCKER_WATCHER_URL: http://docker-watcher:8041
      SYSMETRICS_URL: http://sysmetrics:8035
      GIT_WATCHER_URL: http://git-watcher:8044
      SCREEN_WATCHER_URL: http://screen-watcher:8036
      CLIPBOARD_SERVICE_URL: http://clipboard-service:8024
      HOUSE_DOCTOR_URL: http://house-doctor:8046
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8048/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.37

  wake-service:
    profiles: ["sensors"]
    build:
      context: .
      dockerfile: perception/wake/Dockerfile
    container_name: sovereign-wake-service
    <<: *defaults
    environment:
      OLLAMA_URL: http://ollama:11434
      WAKE_WORDS: "${WAKE_WORDS:-kai,hey kai,ok kai}"
      WAKE_COOLDOWN_SECONDS: "${WAKE_COOLDOWN_SECONDS:-2}"
      WAKE_INTENT_MODEL: "${WAKE_INTENT_MODEL:-qwen2:0.5b}"
      WAKE_CONFIDENCE_THRESHOLD: "${WAKE_CONFIDENCE_THRESHOLD:-0.6}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8022/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.10
    depends_on:
      memu-core:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  supervisor:
    profiles: ["recovery"]
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    container_name: sovereign-supervisor
    <<: *defaults
    environment:
      TOOL_GATE_URL: http://tool-gate:8000
      MEMU_URL: http://memu-core:8001
      HEARTBEAT_URL: http://heartbeat:8010
      DASHBOARD_URL: http://dashboard:8080
      SUPERVISOR_CHECK_INTERVAL: "15"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8051/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.8
    depends_on:
      tool-gate:
        condition: service_healthy
      memu-core:
        condition: service_healthy
      heartbeat:
        condition: service_healthy

  verifier:
    profiles: ["recovery"]
    build:
      context: .
      dockerfile: verifier/Dockerfile
    container_name: sovereign-verifier
    <<: *defaults
    environment:
      MEMU_URL: http://memu-core:8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8052/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.9
    depends_on:
      memu-core:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  turbovec_data:
  soul_data:
  vault_data:
