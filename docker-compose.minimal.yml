version: '3.8'

networks:
  sovereign-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ── Shared defaults ─────────────────────────────────────────────────
x-service-defaults: &defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 2G
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sovereign-postgres
    <<: *defaults
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: keeper
      POSTGRES_PASSWORD: "${DB_PASSWORD:-localdev}"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeper -d sovereign"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.2

  redis:
    image: redis:7-alpine
    container_name: sovereign-redis
    <<: *defaults
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.4

  ollama:
    image: ollama/ollama:latest
    container_name: sovereign-ollama
    <<: *defaults
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.11

  ollama-pull:
    image: ollama/ollama:latest
    container_name: sovereign-ollama-pull
    restart: "no"
    entrypoint: ["sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b} && OLLAMA_HOST=ollama:11434 ollama pull ${EMBEDDING_OLLAMA_MODEL:-all-minilm}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.13

  tool-gate:
    build:
      context: .
      dockerfile: tool-gate/Dockerfile
    container_name: sovereign-tool-gate
    <<: *defaults
    environment:
      MODE: "WORK"
      REQUIRED_CONVICTION: "7.0"
      NONCE_TTL_SECONDS: "300"
      HMAC_ALLOW_DEV_SECRET: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.3
    depends_on:
      postgres:
        condition: service_healthy

  memu-core:
    build:
      context: .
      dockerfile: memu-core/Dockerfile
    container_name: sovereign-memu-core
    <<: *defaults
    environment:
      MEMU_URL: http://memu-core:8001
      MAX_MEMORY_RECORDS: "5000"
      VECTOR_STORE: turbovec
      PG_URI: "postgresql://keeper:${DB_PASSWORD:-localdev}@postgres:5432/sovereign"
      TURBOVEC_INDEX_PATH: /data/turbovec/memories.tv
      # default false (real model or crash, per DECISIONS.md) — CI overrides
      # to true since it's exercising spine/gate logic, not embedding quality
      MEMU_ALLOW_FAKE_EMBEDDINGS: "${MEMU_ALLOW_FAKE_EMBEDDINGS:-false}"
    volumes:
      - turbovec_data:/data/turbovec
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  memu-core-introspect:
    build:
      context: .
      dockerfile: memu-core/Dockerfile.introspect
    container_name: sovereign-memu-core-introspect
    <<: *defaults
    environment:
      VECTOR_STORE: turbovec
      PG_URI: "postgresql://keeper:${DB_PASSWORD:-localdev}@postgres:5432/sovereign"
      TURBOVEC_INDEX_PATH: /data/turbovec/memories.tv
      MEMU_ALLOW_FAKE_EMBEDDINGS: "${MEMU_ALLOW_FAKE_EMBEDDINGS:-false}"
    volumes:
      - turbovec_data:/data/turbovec
    ports:
      - "8009:8009"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8009/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.14
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  agentic:
    build:
      context: .
      dockerfile: agentic/Dockerfile
    container_name: sovereign-agentic
    <<: *defaults
    environment:
      MEMU_URL: http://memu-core:8001
      TOOL_GATE_URL: http://tool-gate:8000
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      LLM_TIMEOUT: "120"
      WAKE_URL: http://wake-service:8022
      FF_WAKE_INTENT_ROUTING: "${FF_WAKE_INTENT_ROUTING:-false}"
      HMAC_ALLOW_DEV_SECRET: "true"
    ports:
      - "8007:8007"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.12
    depends_on:
      memu-core:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  heartbeat:
    build:
      context: .
      dockerfile: heartbeat/Dockerfile
    container_name: sovereign-heartbeat
    <<: *defaults
    environment:
      MEMU_INTROSPECT_URL: http://memu-core-introspect:8009
      CHECK_INTERVAL: "60"
      ALERT_WINDOW: "300"
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.6
    depends_on:
      memu-core:
        condition: service_healthy
      memu-core-introspect:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sovereign-dashboard
    <<: *defaults
    environment:
      TOOL_GATE_URL: http://tool-gate:8000
      MEMU_URL: http://memu-core:8001
      MEMU_INTROSPECT_URL: http://memu-core-introspect:8009
      HEARTBEAT_URL: http://heartbeat:8010
      SUPERVISOR_URL: http://supervisor:8051
      WAKE_URL: http://wake-service:8022
      AUDIO_SERVICE_URL: http://audio-service:8021
      TTS_SERVICE_URL: http://tts-service:8030
      BROWSER_AGENT_URL: http://browser-agent:8040
      VISION_SERVICE_URL: http://vision-service:8023
      CLIPBOARD_SERVICE_URL: http://clipboard-service:8024
      FILES_SERVICE_URL: http://files-service:8025
      NOTIFY_SERVICE_URL: http://notify-service:8031
      DOC_PARSER_URL: http://document-parser:8032
      LANGGRAPH_URL: http://agentic:8007
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.7
    depends_on:
      tool-gate:
        condition: service_healthy
      memu-core:
        condition: service_healthy
      memu-core-introspect:
        condition: service_healthy
      heartbeat:
        condition: service_healthy
      supervisor:
        condition: service_started
      wake-service:
        condition: service_started
      audio-service:
        condition: service_started
      tts-service:
        condition: service_started
      browser-agent:
        condition: service_started
      vision-service:
        condition: service_started
      clipboard-service:
        condition: service_started
      files-service:
        condition: service_started
      notify-service:
        condition: service_started
      document-parser:
        condition: service_started
      agentic:
        condition: service_started

  audio-service:
    build:
      context: .
      dockerfile: perception/audio/Dockerfile
    container_name: sovereign-audio-service
    <<: *defaults
    environment:
      WHISPER_BACKEND: "${WHISPER_BACKEND:-stub}"
      WHISPER_MODEL: "${WHISPER_MODEL:-tiny}"
      MEMU_URL: http://memu-core:8001
    ports:
      - "8021:8021"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8021/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.15
    depends_on:
      memu-core:
        condition: service_healthy

  tts-service:
    build:
      context: .
      dockerfile: output/tts/Dockerfile
    container_name: sovereign-tts-service
    <<: *defaults
    environment:
      TTS_BACKEND: "${TTS_BACKEND:-edge}"
      TTS_VOICE: "${TTS_VOICE:-en-GB-RyanNeural}"
    ports:
      - "8030:8030"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8030/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.16

  browser-agent:
    build:
      context: .
      dockerfile: browser-agent/Dockerfile
    container_name: sovereign-browser-agent
    <<: *defaults
    environment:
      BROWSER_HEADLESS: "true"
      NAV_TIMEOUT_MS: "${NAV_TIMEOUT_MS:-20000}"
      MAX_SCRAPE_CHARS: "${MAX_SCRAPE_CHARS:-50000}"
      FF_BROWSER_AGENT: "${FF_BROWSER_AGENT:-false}"
    ports:
      - "8040:8040"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8040/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.17

  vision-service:
    build:
      context: .
      dockerfile: perception/vision/Dockerfile
    container_name: sovereign-vision-service
    <<: *defaults
    environment:
      MIN_FACE_SIZE: "${MIN_FACE_SIZE:-30}"
      VISION_BACKEND: "${VISION_BACKEND:-opencv}"
    ports:
      - "8023:8023"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8023/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.18

  clipboard-service:
    build:
      context: .
      dockerfile: perception/clipboard/Dockerfile
    container_name: sovereign-clipboard-service
    <<: *defaults
    environment:
      CLIPBOARD_MAX_HISTORY: "${CLIPBOARD_MAX_HISTORY:-50}"
      CLIPBOARD_MAX_BYTES: "${CLIPBOARD_MAX_BYTES:-262144}"
    ports:
      - "8024:8024"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8024/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.19

  files-service:
    build:
      context: .
      dockerfile: perception/files/Dockerfile
    container_name: sovereign-files-service
    <<: *defaults
    environment:
      WATCH_DIRS: "${WATCH_DIRS:-}"
      FILES_MAX_EVENTS: "${FILES_MAX_EVENTS:-200}"
    volumes:
      - "${WATCH_ROOT:-/tmp}:/watched:ro"
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8025/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.20

  notify-service:
    build:
      context: .
      dockerfile: output/notify/Dockerfile
    container_name: sovereign-notify-service
    <<: *defaults
    environment:
      NOTIFY_MAX_PENDING: "${NOTIFY_MAX_PENDING:-100}"
    ports:
      - "8031:8031"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8031/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.21

  document-parser:
    build:
      context: .
      dockerfile: document-parser/Dockerfile
    container_name: sovereign-document-parser
    <<: *defaults
    ports:
      - "8032:8032"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8032/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.22

  wake-service:
    build:
      context: .
      dockerfile: perception/wake/Dockerfile
    container_name: sovereign-wake-service
    <<: *defaults
    environment:
      OLLAMA_URL: http://ollama:11434
      WAKE_WORDS: "${WAKE_WORDS:-kai,hey kai,ok kai}"
      WAKE_COOLDOWN_SECONDS: "${WAKE_COOLDOWN_SECONDS:-2}"
      WAKE_INTENT_MODEL: "${WAKE_INTENT_MODEL:-qwen2:0.5b}"
      WAKE_CONFIDENCE_THRESHOLD: "${WAKE_CONFIDENCE_THRESHOLD:-0.6}"
    ports:
      - "8022:8022"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8022/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.10
    depends_on:
      memu-core:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    container_name: sovereign-supervisor
    <<: *defaults
    environment:
      TOOL_GATE_URL: http://tool-gate:8000
      MEMU_URL: http://memu-core:8001
      HEARTBEAT_URL: http://heartbeat:8010
      DASHBOARD_URL: http://dashboard:8080
      SUPERVISOR_CHECK_INTERVAL: "15"
    ports:
      - "8051:8051"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8051/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.8
    depends_on:
      tool-gate:
        condition: service_healthy
      memu-core:
        condition: service_healthy
      heartbeat:
        condition: service_healthy

  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    container_name: sovereign-verifier
    <<: *defaults
    environment:
      MEMU_URL: http://memu-core:8001
    ports:
      - "8052:8052"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8052/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sovereign-net:
        ipv4_address: 172.20.0.9
    depends_on:
      memu-core:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  turbovec_data:
