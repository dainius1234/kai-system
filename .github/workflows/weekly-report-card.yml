name: Weekly Report Card

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report-card:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 360 minutes; a hung job burns six
    # hours and reads as "still running". Run 697 of core-tests sat at
    # 133.9 minutes and finished with no conclusion at all. 60 is over
    # twice the longest successful run of any workflow here, so it
    # cannot cut short work that is progressing. All nine jobs were
    # unbounded — the bound is applied to the whole set, not to the one
    # workflow whose change prompted it.
    timeout-minutes: 60

    env:
      HMAC_ALLOW_DEV_SECRET: "true"
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          find . -name requirements.txt \
               -not -path './.venv/*' \
               -not -path './_archive/*' \
               -not -path './.*' \
            | while read f; do pip install -r "$f" --quiet || true; done
          pip install pytest pytest-cov --quiet

      - name: go/no-go compile check
        id: gonogo
        run: |
          set +e
          out=$(make go_no_go 2>&1)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # A fixed `EOF` delimiter cannot bound arbitrary command output:
          # if the captured text contains a line that is exactly `EOF`, the
          # block never closes and the runner rejects the whole file with
          #   Invalid value. Matching delimiter not found 'EOF'
          # which is what killed this workflow. A per-step random delimiter
          # cannot collide with content it was generated after.
          d="EOF_$RANDOM$RANDOM$RANDOM"
          echo "output<<$d" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$d" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run core unit tests (fast Python-only subset)
        id: tests
        run: |
          set +e
          # Run the fast, pure-Python unit tests that don't need Docker or GPU
          out=$(python -m pytest \
            scripts/test_letta_agent.py \
            scripts/test_financial_awareness.py \
            scripts/test_error_codes.py \
            scripts/test_feature_flags.py \
            scripts/test_focus_compress.py \
            scripts/test_context_budget.py \
            scripts/test_p4_personality.py \
            scripts/test_p16_operational.py \
            scripts/test_p17_emotional_intelligence.py \
            scripts/test_p18_narrative_identity.py \
            scripts/test_p19_imagination_engine.py \
            scripts/test_p20_conscience_values.py \
            scripts/test_p21_proactive_agent.py \
            scripts/test_p22_operator_model.py \
            scripts/test_behavioral.py \
            --tb=no -q 2>&1)
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Extract pass/fail summary line
          summary=$(echo "$out" | grep -E "passed|failed|error" | tail -1)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          # A fixed `EOF` delimiter cannot bound arbitrary command output:
          # if the captured text contains a line that is exactly `EOF`, the
          # block never closes and the runner rejects the whole file with
          #   Invalid value. Matching delimiter not found 'EOF'
          # which is what killed this workflow. A per-step random delimiter
          # cannot collide with content it was generated after.
          d="EOF_$RANDOM$RANDOM$RANDOM"
          echo "output<<$d" >> "$GITHUB_OUTPUT"
          echo "$out" | tail -30 >> "$GITHUB_OUTPUT"
          echo "$d" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Behavioral scoreboard (LLM quality — advisory)
        id: scoreboard
        run: |
          set +e
          out=$(python scripts/behavioral_scoreboard.py 2>&1)
          code=$?
          # A fixed `EOF` delimiter cannot bound arbitrary command output:
          # if the captured text contains a line that is exactly `EOF`, the
          # block never closes and the runner rejects the whole file with
          #   Invalid value. Matching delimiter not found 'EOF'
          # which is what killed this workflow. A per-step random delimiter
          # cannot collide with content it was generated after.
          d="EOF_$RANDOM$RANDOM$RANDOM"
          echo "output<<$d" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$d" >> "$GITHUB_OUTPUT"
          exit 0

      # ci-toleration: documented-skip
      - name: Post Weekly Report Card issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GONOGO_CODE: ${{ steps.gonogo.outputs.exit_code }}
          GONOGO_OUT: ${{ steps.gonogo.outputs.output }}
          TEST_CODE: ${{ steps.tests.outputs.exit_code }}
          TEST_SUMMARY: ${{ steps.tests.outputs.summary }}
          TEST_OUT: ${{ steps.tests.outputs.output }}
          SCOREBOARD_OUT: ${{ steps.scoreboard.outputs.output }}
        run: |
          today=$(date -u +%Y-%m-%d)
          gonogo_icon=$( [ "$GONOGO_CODE" = "0" ] && echo "✅ PASS" || echo "🔴 FAIL" )
          test_icon=$(   [ "$TEST_CODE"   = "0" ] && echo "✅ PASS" || echo "🔴 FAIL" )

          overall="✅ All green"
          if [ "$GONOGO_CODE" != "0" ] || [ "$TEST_CODE" != "0" ]; then
            overall="🔴 Regressions detected — review before next PR"
          fi

          body="## Weekly Report Card — ${today}

          > ${overall}

          | Check | Result |
          |-------|--------|
          | go/no-go compile | ${gonogo_icon} |
          | Unit test suite | ${test_icon} |
          | Behavioral scoreboard | advisory (see below) |

          ### go/no-go detail
          \`\`\`
          ${GONOGO_OUT}
          \`\`\`

          ### Unit test results
          **${TEST_SUMMARY}**
          \`\`\`
          ${TEST_OUT}
          \`\`\`

          ### Behavioral scoreboard (LLM quality — advisory)
          \`\`\`
          ${SCOREBOARD_OUT}
          \`\`\`

          ---
          _Generated by [Weekly Report Card](.github/workflows/weekly-report-card.yml) · close after review_"

          gh issue create \
            --repo "$REPO" \
            --title "Weekly Report Card — ${today}" \
            --body "$body" \
            --label "report-card" \
            || echo "::warning::Could not create issue (label may not exist yet)"
