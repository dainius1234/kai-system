name: Core Tests

# `main`-only was how a week of red went unseen in python-app.yml: the
# branch the work happens on could not observe the result. Same trigger,
# same blind spot, so the same fix. PRs still target main only.
on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    env:
      HMAC_ALLOW_DEV_SECRET: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pip-audit
          # install each requirements.txt individually (skip hidden/archive dirs)
          find . -name requirements.txt \
               -not -path './.venv/*' \
               -not -path './_archive/*' \
               -not -path './.*' \
            | while read f; do pip install -r "$f" || true; done

      # ci-toleration: needs-owner
      - name: Dependency vulnerability scan
        run: |
          # `2>/dev/null` used to hide the reason for a non-zero exit,
          # so the warning said "found vulnerabilities" even when the
          # real cause was an unauditable *system* package. Declared in
          # scripts/security/check_ci_tolerations.py as needs-owner:
          # real CVEs exist in transitive deps we do not pin, so this
          # cannot enforce until there is an ignore-file with expiry.
          if pip-audit --desc; then
            echo "pip-audit: clean"
          else
            echo "::warning::SKIPPED ENFORCEMENT — pip-audit reported findings above."
            echo "  Declared needs-owner, review by 2026-10-01."
            echo "### pip-audit: findings reported, not enforced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Syntax check + go/no-go quality gate
        run: |
          make go_no_go

      - name: Doc-drift check (README metrics match codebase)
        run: |
          make check-docs

      - name: Run core unit tests
        run: |
          make test-core

      - name: Upload endpoint security fuzz (boundary + error-mapping)
        run: |
          make test-upload-fuzz

      - name: Audio transcribe endpoint fuzz (boundary + error-mapping)
        run: |
          make test-audio-transcribe

      - name: Browser agent service tests (mocked playwright)
        run: |
          make test-browser-agent

      - name: Vision service tests (mocked OpenCV)
        run: |
          make test-vision-service

      - name: Clipboard service tests
        run: |
          make test-clipboard-service

      - name: File watcher service tests
        run: |
          make test-files-service

      - name: Notify service tests
        run: |
          make test-notify-service

      - name: Document parser service tests (mocked heavy libs)
        run: |
          make test-document-parser

      - name: Monitor service tests
        run: |
          make test-monitor-service

      - name: Broker bridge service tests (mocked Binance REST)
        run: |
          make test-broker-bridge

      - name: Sysmetrics service tests (mocked psutil)
        run: |
          pip install psutil --quiet || true
          make test-sysmetrics

      - name: Screen watcher service tests (mocked screen-capture)
        run: |
          make test-screen-watcher

      - name: Email reader service tests (mocked IMAP)
        run: |
          make test-email-reader

      - name: News feed service tests (mocked feedparser + httpx)
        run: |
          pip install feedparser --quiet || true
          make test-news-feed

      - name: Weather service tests (mocked httpx)
        run: |
          make test-weather-service

      - name: Docker watcher service tests (mocked docker SDK)
        run: |
          make test-docker-watcher

      - name: Air quality service tests (mocked httpx)
        run: |
          make test-airquality

      - name: Calendar service tests (mocked caldav + icalendar)
        run: |
          pip install caldav icalendar --quiet || true
          make test-calendar-service

      - name: Git watcher service tests
        run: make test-git-watcher

      - name: Stocks/forex yfinance tests (mocked yfinance)
        run: pip install yfinance --quiet || true && make test-broker-bridge-yfinance

      - name: Kai intelligence layer tests (D87 — world context, proactive observer, skill matching)
        run: make test-kai-intelligence

      - name: Cognitive mechanisms tests (D88 — anomaly detection, correlation, skill hunter, scheduling)
        run: pip install pytest-asyncio --quiet || true && make test-cognitive-mechanisms

      - name: Cognitive depth tests (D89 — FSM, teammates, house-doctor, counterfactual, curiosity)
        run: make test-d89-cognitive-depth

      - name: Swarm assembly tests (D90 — SwarmContext, reputation, conflict resolution, 5 stage functions)
        run: make test-d90-swarm

      - name: Vault-sync tests (D91 — parser, mapper, watcher, app endpoints, memu-core vault API, feature flags)
        run: make test-d91-vault-sync

      - name: Socratic self-questioning tests (D92 — SocraticQuestioner, parse, enrich, fallback, FF gate)
        run: make test-d92-socratic

      - name: Hypothesis engine tests (D93 — HypothesisEngine, form, test, CURIOSITY.md logging)
        run: make test-d93-hypothesis

      - name: Temporal projection tests (D94 — TemporalForecaster, ForecastFan, four scenario branches)
        run: make test-d94-forecaster

      - name: GPU-era foundation stubs (D95–D100 — dialectic, analogy, blend, fingerprint, synthetic, transitive)
        run: make test-d95-d100-foundations

      - name: Causal world model + policy memory tests (D101 — CausalGraph, WorldModelSimulator, PolicyMemory, CausalSurpriseDetector, PolicyLibrary)
        run: make test-d101-causal-world-model

      - name: Global workspace consciousness tests (D102 — WorkspaceBid, ConsciousMoment, GlobalWorkspace, singleton)
        run: make test-d102-global-workspace

      - name: Ohana Core tests (D109 — MoralFingerprint, MoralContext, OhanaCore, singleton)
        run: make test-d109-ohana-core

      - name: Per-module coverage floors (agentic ≥45 %, memu-core ≥60 %, combined ≥60 %)
        run: |
          make coverage-floors

      # ci-toleration: documented-skip
      - name: GitHub Models CI backend smoke test (best-effort)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI/tests-only LLM backend (D36) — gives a real model response
          # for test feedback instead of relying solely on the local
          # qwen2:0.5b stub. Free-tier/rate-limited by design (see
          # scripts/github_models_client.py), so failures here are a
          # warning, not a build-breaker.
          if make test-github-models; then
            echo "github-models: ran and passed"
          else
            echo "::warning::SKIPPED — GitHub Models smoke test did not run to completion (free tier is rate-limited)."
            echo "  Declared documented-skip, review by 2026-11-01."
            echo "### GitHub Models smoke test: SKIPPED (rate limit)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
                      /opt/hostedtoolcache/node
          sudo apt-get clean
          docker system prune -af --volumes
          df -h

      - name: Build full stack Docker images
        run: |
          docker compose -f docker-compose.full.yml build

      # ci-toleration: needs-owner
      - name: Scan container images for vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      # Findings are ADVISORY; a scanner that could not run is not.
      #
      # Operator decision, 2026-08-05: these CVEs live in base images and
      # have existed all along — the steps that build those images had not
      # executed for 30 commits, so nothing had ever looked. Treated
      # exactly like the pip-audit step above: it runs, it reports, it
      # does not block, and the remediation has a named owner and a date.
      #
      # The distinction that matters: `continue-on-error` swallows the
      # *findings*, and this step puts back the failure for the case where
      # the scan did not happen at all. A missing scanner or an unbuilt
      # image is absence of evidence, and this repository has paid for
      # reading that as evidence of absence more than once.
      - name: Vulnerability findings are advisory, a broken scanner is not
        run: |
          outcome='${{ steps.trivy.outcome }}'
          case "$outcome" in
            success)
              echo "trivy: no CRITICAL/HIGH findings"
              ;;
            failure)
              echo "::warning::SKIPPED ENFORCEMENT — trivy reported CRITICAL/HIGH findings above."
              echo "  Declared needs-owner, review by 2026-11-01. Tracked as KAI-GATE-026."
              echo "### trivy: findings reported, not enforced (KAI-GATE-026)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "trivy did not run to completion (outcome=$outcome)."
              echo "A scan that could not execute is not a clean scan."
              exit 1
              ;;
          esac

      - name: Bring up minimal sovereign AI stack
        env:
          # memu-core's embedding backend is real-model-or-crash by design
          # (DECISIONS.md) — CI exercises spine/gate logic, not embedding
          # quality, and can't rely on the HF model download succeeding.
          MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
        run: |
          docker compose -f docker-compose.minimal.yml up -d --build
          # wait for tool-gate (fast) and agentic (waits on the ollama model
          # pull, so give it longer) to respond
          for i in {1..30}; do
            if curl -s http://localhost:8000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          for i in {1..180}; do
            if curl -s http://localhost:8007/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # memu-core-introspect — store-maintenance process split off memu-core
          # (see DECISIONS.md D21), independent of the ollama pull above
          for i in {1..30}; do
            if curl -s http://localhost:8009/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.minimal.yml ps
          docker compose -f docker-compose.minimal.yml logs --no-color
      - name: Run integration smoke script
        run: |
          python3 scripts/test_core_integration.py
      - name: Kill-isolation — introspect crash must not affect hot path
        run: |
          # Stop the cold-maintenance process (memu-core-introspect, port 8009)
          docker compose -f docker-compose.minimal.yml stop memu-core-introspect
          # Hot path (memu-core, port 8001) must still be healthy
          curl -sf http://localhost:8001/health \
            || (echo "FAIL: memu-core unhealthy after introspect stop" && exit 1)
          # Hot memorize write must still succeed
          RESULT=$(curl -sf -X POST http://localhost:8001/memory/memorize \
            -H "Content-Type: application/json" \
            -d '{"timestamp":"2026-01-01T00:00:00Z","event_type":"ci-kill-isolation","result_raw":"kill isolation smoke test","user_id":"ci"}')
          echo "$RESULT" | python3 scripts/ci/assert_memorize_ok.py
          # Restart introspect and confirm it recovers
          docker compose -f docker-compose.minimal.yml start memu-core-introspect
          for i in {1..30}; do
            if curl -s http://localhost:8009/health >/dev/null 2>&1; then
              echo "OK: memu-core-introspect recovered"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8009/health \
            || (echo "FAIL: memu-core-introspect did not recover" && exit 1)

      - name: Restart-persistence smoke test — memory survives memu-core restart
        env:
          MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
        run: |
          python3 scripts/test_restart_persistence.py \
            --url http://localhost:8001 \
            --compose-file docker-compose.minimal.yml \
            --service memu-core

      - name: Tear down minimal stack
        if: always()
        run: |
          docker compose -f docker-compose.minimal.yml down

      - name: Bring up memu-graph (Cognee/Kuzu live verification)
        env:
          # D49/D51: qwen2.5:0.5b is too small to reliably produce valid
          # structured JSON under Cognee's instructor/Pydantic validation
          # (acreate_structured_output) — failures there surface as a
          # misleading "LLM connection test timed out" even though Ollama
          # itself responds 200 OK promptly. qwen2.5:1.5b (D49) got past
          # invalid-JSON-syntax failures but still echoed the Response
          # schema's *description* back instead of filling it in (D51) —
          # syntactically valid JSON, semantically wrong. qwen2.5:3b is the
          # next step up. Override OLLAMA_MODEL just for this step/stack
          # (only ollama, ollama-pull, memu-graph are started here) so the
          # project-wide CPU-safe default in docker-compose.full.yml and
          # .env.example is untouched.
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          docker compose -f docker-compose.full.yml up -d ollama ollama-pull memu-graph
          for i in {1..120}; do
            if curl -s http://localhost:8061/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      # ci-toleration: needs-owner
      - name: Run memu-graph live ingest/query/forget cycle (best-effort)
        run: |
          pip install requests
          # This is live verification, which this programme is shortest
          # of, and it is currently allowed to fail every run. Declared
          # needs-owner so the skip is dated rather than permanent.
          if python3 scripts/test_graph_live.py; then
            echo "memu-graph live verification: PASSED"
            echo "### memu-graph live verification: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DID NOT VERIFY — memu-graph live cycle failed (Ollama model quality / extension.kuzudb.com)."
            echo "  This step proves nothing when it fails. Declared needs-owner, review by 2026-10-01."
            echo "### memu-graph live verification: DID NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump memu-graph logs (always, since the step above is best-effort)
        if: always()
        run: |
          docker compose -f docker-compose.full.yml ps
          docker compose -f docker-compose.full.yml logs ollama ollama-pull memu-graph --no-color

      - name: Tear down memu-graph stack
        if: always()
        run: |
          docker compose -f docker-compose.full.yml down

      - name: Boot sovereign profile (pgvector postgres + tool-gate + memu-core)
        env:
          MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
          DB_PASSWORD: localdev
        run: |
          # S4: First CI verification that the sovereign compose boots correctly.
          # Only start the three services that don't need Tailscale/Vault/Ollama.
          # memu-core with VECTOR_STORE=postgres validates the D79 pgvector image fix.
          docker compose -f docker-compose.sovereign.yml up -d postgres tool-gate memu-core
          # Wait for postgres (needed by tool-gate and memu-core)
          for i in {1..60}; do
            if docker compose -f docker-compose.sovereign.yml exec -T postgres pg_isready -U keeper -d sovereign >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # Wait for tool-gate health
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # Wait for memu-core health (VECTOR_STORE=postgres — validates pgvector image)
          for i in {1..60}; do
            if curl -sf http://localhost:8001/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          echo "--- Sovereign boot health ---"
          curl -sf http://localhost:8000/health || (echo "tool-gate unhealthy" && exit 1)
          curl -sf http://localhost:8001/health || (echo "memu-core unhealthy" && exit 1)

      - name: Dump sovereign logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.sovereign.yml ps
          docker compose -f docker-compose.sovereign.yml logs postgres tool-gate memu-core --no-color

      - name: Tear down sovereign stack
        if: always()
        run: |
          docker compose -f docker-compose.sovereign.yml down -v
