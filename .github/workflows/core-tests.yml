name: Core Tests

# `main`-only was how a week of red went unseen in python-app.yml: the
# branch the work happens on could not observe the result. Same trigger,
# same blind spot, so the same fix. PRs still target main only.
on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    env:
      HMAC_ALLOW_DEV_SECRET: "true"
      # Declared here, at job scope, so every `docker compose` invocation
      # in this job has them — including `config`, `ps` and `down`, which
      # parse the file and warn just as `up` does.
      #
      # Until 2026-08-05 these produced six
      #     The "X" variable is not set. Defaulting to a blank string.
      # lines on every compose command, in every log, all day. That is
      # wallpaper, and wallpaper is how a real warning goes unread —
      # `DB_PASSWORD` was among them and postgres was refusing to start
      # because of it.
      #
      # They are declared EMPTY here rather than given `:-` defaults in
      # the compose files, and the distinction is the point: those files
      # are the production deployment definition, where an absent
      # `VAULT_ROOT_TOKEN` or `GRAFANA_ADMIN_PASSWORD` *should* warn.
      # Silencing them there would trade CI noise for production risk.
      # Here it states a fact about this job: tailscale, grafana and
      # vault are not started, so their secrets are intentionally absent.
      DB_PASSWORD: localdev
      TS_AUTHKEY: ""
      TS_HOSTNAME: ""
      GRAFANA_ADMIN_USER: ""
      GRAFANA_ADMIN_PASSWORD: ""
      VAULT_ROOT_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pip-audit
          # install each requirements.txt individually (skip hidden/archive dirs)
          find . -name requirements.txt \
               -not -path './.venv/*' \
               -not -path './_archive/*' \
               -not -path './.*' \
            | while read f; do pip install -r "$f" || true; done

      # ci-toleration: needs-owner
      - name: Dependency vulnerability scan
        run: |
          # `2>/dev/null` used to hide the reason for a non-zero exit,
          # so the warning said "found vulnerabilities" even when the
          # real cause was an unauditable *system* package. Declared in
          # scripts/security/check_ci_tolerations.py as needs-owner:
          # real CVEs exist in transitive deps we do not pin, so this
          # cannot enforce until there is an ignore-file with expiry.
          if pip-audit --desc; then
            echo "pip-audit: clean"
          else
            echo "::warning::SKIPPED ENFORCEMENT — pip-audit reported findings above."
            echo "  Declared needs-owner, review by 2026-10-01."
            echo "### pip-audit: findings reported, not enforced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Syntax check + go/no-go quality gate
        run: |
          make go_no_go

      - name: Doc-drift check (README metrics match codebase)
        run: |
          make check-docs

      - name: Run core unit tests
        run: |
          make test-core

      - name: Upload endpoint security fuzz (boundary + error-mapping)
        run: |
          make test-upload-fuzz

      - name: Audio transcribe endpoint fuzz (boundary + error-mapping)
        run: |
          make test-audio-transcribe

      - name: Browser agent service tests (mocked playwright)
        run: |
          make test-browser-agent

      - name: Vision service tests (mocked OpenCV)
        run: |
          make test-vision-service

      - name: Clipboard service tests
        run: |
          make test-clipboard-service

      - name: File watcher service tests
        run: |
          make test-files-service

      - name: Notify service tests
        run: |
          make test-notify-service

      - name: Document parser service tests (mocked heavy libs)
        run: |
          make test-document-parser

      - name: Monitor service tests
        run: |
          make test-monitor-service

      - name: Broker bridge service tests (mocked Binance REST)
        run: |
          make test-broker-bridge

      - name: Sysmetrics service tests (mocked psutil)
        run: |
          pip install psutil --quiet || true
          make test-sysmetrics

      - name: Screen watcher service tests (mocked screen-capture)
        run: |
          make test-screen-watcher

      - name: Email reader service tests (mocked IMAP)
        run: |
          make test-email-reader

      - name: News feed service tests (mocked feedparser + httpx)
        run: |
          pip install feedparser --quiet || true
          make test-news-feed

      - name: Weather service tests (mocked httpx)
        run: |
          make test-weather-service

      - name: Docker watcher service tests (mocked docker SDK)
        run: |
          make test-docker-watcher

      - name: Air quality service tests (mocked httpx)
        run: |
          make test-airquality

      - name: Calendar service tests (mocked caldav + icalendar)
        run: |
          pip install caldav icalendar --quiet || true
          make test-calendar-service

      - name: Git watcher service tests
        run: make test-git-watcher

      - name: Stocks/forex yfinance tests (mocked yfinance)
        run: pip install yfinance --quiet || true && make test-broker-bridge-yfinance

      - name: Kai intelligence layer tests (D87 — world context, proactive observer, skill matching)
        run: make test-kai-intelligence

      - name: Cognitive mechanisms tests (D88 — anomaly detection, correlation, skill hunter, scheduling)
        run: pip install pytest-asyncio --quiet || true && make test-cognitive-mechanisms

      - name: Cognitive depth tests (D89 — FSM, teammates, house-doctor, counterfactual, curiosity)
        run: make test-d89-cognitive-depth

      - name: Swarm assembly tests (D90 — SwarmContext, reputation, conflict resolution, 5 stage functions)
        run: make test-d90-swarm

      - name: Vault-sync tests (D91 — parser, mapper, watcher, app endpoints, memu-core vault API, feature flags)
        run: make test-d91-vault-sync

      - name: Socratic self-questioning tests (D92 — SocraticQuestioner, parse, enrich, fallback, FF gate)
        run: make test-d92-socratic

      - name: Hypothesis engine tests (D93 — HypothesisEngine, form, test, CURIOSITY.md logging)
        run: make test-d93-hypothesis

      - name: Temporal projection tests (D94 — TemporalForecaster, ForecastFan, four scenario branches)
        run: make test-d94-forecaster

      - name: GPU-era foundation stubs (D95–D100 — dialectic, analogy, blend, fingerprint, synthetic, transitive)
        run: make test-d95-d100-foundations

      - name: Causal world model + policy memory tests (D101 — CausalGraph, WorldModelSimulator, PolicyMemory, CausalSurpriseDetector, PolicyLibrary)
        run: make test-d101-causal-world-model

      - name: Global workspace consciousness tests (D102 — WorkspaceBid, ConsciousMoment, GlobalWorkspace, singleton)
        run: make test-d102-global-workspace

      - name: Ohana Core tests (D109 — MoralFingerprint, MoralContext, OhanaCore, singleton)
        run: make test-d109-ohana-core

      - name: Per-module coverage floors (agentic ≥45 %, memu-core ≥60 %, combined ≥60 %)
        run: |
          make coverage-floors

      # ci-toleration: documented-skip
      - name: GitHub Models CI backend smoke test (best-effort)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI/tests-only LLM backend (D36) — gives a real model response
          # for test feedback instead of relying solely on the local
          # qwen2:0.5b stub. Free-tier/rate-limited by design (see
          # scripts/github_models_client.py), so failures here are a
          # warning, not a build-breaker.
          if make test-github-models; then
            echo "github-models: ran and passed"
          else
            echo "::warning::SKIPPED — GitHub Models smoke test did not run to completion (free tier is rate-limited)."
            echo "  Declared documented-skip, review by 2026-11-01."
            echo "### GitHub Models smoke test: SKIPPED (rate limit)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Guards everything below it. On 2026-08-05 `ollama/ollama:0.6` had
      # been withdrawn from Docker Hub, so the bring-up died in under a
      # second with `manifest unknown` and thirteen steps never ran — and
      # the image build above passed, because `docker compose build`
      # builds `build:` services and never touches an `image:` one.
      # Nothing looked at the pull until `up`.
      #
      # Asking the registry costs seconds and fails with the name of the
      # image instead of forty minutes later with a manifest error.
      - name: Every pinned image still exists in its registry
        run: |
          python3 scripts/security/check_image_tags.py --verify-exists

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
                      /opt/hostedtoolcache/node
          sudo apt-get clean
          docker system prune -af --volumes
          df -h

      # "Full" is a name that lies: `docker-compose.full.yml` declares 30
      # built services, `docker-compose.minimal.yml` declares 32, and
      # **19 of minimal's are not in full at all** — calendar-service,
      # broker-bridge, vault-sync, cortex and fifteen others. So this
      # step never built most of what the bring-up below actually needs,
      # and a Dockerfile fault in any of those nineteen surfaced as a
      # mysterious `up` failure rather than as a build failure with the
      # build's own error message.
      #
      # Both profiles are built, minimal first, because minimal is the
      # one that then gets started.
      - name: Build the images the bring-up needs
        run: |
          set -o pipefail
          docker compose -f docker-compose.minimal.yml build 2>&1 \
            | tee /tmp/build-minimal.log | tail -40
          df -h / | tail -1

      - name: Build full stack Docker images
        run: |
          set -o pipefail
          docker compose -f docker-compose.full.yml build 2>&1 \
            | tee /tmp/build-full.log | tail -40
          df -h / | tail -1

      # ci-toleration: needs-owner
      - name: Scan container images for vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      # Findings are ADVISORY; a scanner that could not run is not.
      #
      # Operator decision, 2026-08-05: these CVEs live in base images and
      # have existed all along — the steps that build those images had not
      # executed for 30 commits, so nothing had ever looked. Treated
      # exactly like the pip-audit step above: it runs, it reports, it
      # does not block, and the remediation has a named owner and a date.
      #
      # The distinction that matters: `continue-on-error` swallows the
      # *findings*, and this step puts back the failure for the case where
      # the scan did not happen at all. A missing scanner or an unbuilt
      # image is absence of evidence, and this repository has paid for
      # reading that as evidence of absence more than once.
      - name: Vulnerability findings are advisory, a broken scanner is not
        run: |
          outcome='${{ steps.trivy.outcome }}'
          case "$outcome" in
            success)
              echo "trivy: no CRITICAL/HIGH findings"
              ;;
            failure)
              echo "::warning::SKIPPED ENFORCEMENT — trivy reported CRITICAL/HIGH findings above."
              echo "  Declared needs-owner, review by 2026-11-01. Tracked as KAI-GATE-026."
              echo "### trivy: findings reported, not enforced (KAI-GATE-026)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "trivy did not run to completion (outcome=$outcome)."
              echo "A scan that could not execute is not a clean scan."
              exit 1
              ;;
          esac

      - name: Bring up minimal sovereign AI stack
        env:
          # memu-core's embedding backend is real-model-or-crash by design
          # (DECISIONS.md) — CI exercises spine/gate logic, not embedding
          # quality, and can't rely on the HF model download succeeding.
          MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
          # `POSTGRES_PASSWORD: ${DB_PASSWORD}` has no default, by design:
          # a default password in a shipped compose file is what
          # check_secret_fallbacks exists to forbid. So CI must supply
          # one, and this step did not — the sovereign boot step further
          # down was the only place that set it. postgres refuses to
          # initialise with an empty superuser password, so the container
          # went unhealthy and every dependent failed with
          # "dependency failed to start".
          #
          # `The "DB_PASSWORD" variable is not set. Defaulting to a blank
          # string.` was printed by every compose invocation in this
          # workflow, all day, and I read past it as noise. The warning
          # was the answer. It is set at job scope now, so every
          # compose command in this job has it, not just this one.
        run: |
          set -o pipefail
          # Captured, because the post-mortem used to *re-run* the
          # bring-up to get its error into the readable tail — with
          # `--no-build`, which is a different command and produced a
          # different failure ("No such image"). A diagnostic that
          # changes the thing it measures reports the wrong cause; that
          # is the defect this whole programme is about, and it was in
          # the tool I built to find it. The real output is kept instead.
          docker compose -f docker-compose.minimal.yml up -d --build \
            2>&1 | tee /tmp/bringup.log
          df -h / | tail -1

          # The operator's rule, from the DB_PASSWORD incident: if a
          # warning is worth printing on every run and nobody acts on it,
          # the system is missing either a hard failure or a deliberate
          # silence. Printing forever is what teaches everyone to ignore
          # it.
          #
          # Every variable this job intentionally leaves empty is now
          # declared at job scope, so a substitution warning here means a
          # variable nobody has accounted for. That is actionable, so it
          # fails.
          if grep -q 'variable is not set' /tmp/bringup.log; then
            echo "::error::A compose variable was substituted blank"
            grep -o 'The "[A-Z_]*" variable is not set' /tmp/bringup.log \
              | sort -u
            echo "Declare it at job scope if intentionally absent."
            exit 1
          fi
          # Waits on Docker's verdict of each service's own healthcheck.
          # These three used to be `curl http://localhost:8000|8007|8009`,
          # which addressed nothing: tool-gate, agentic and
          # memu-core-introspect are on networks declared `internal: true`
          # and publish no host port. agentic waits on the ollama model
          # pull, hence the longer budget.
          python3 scripts/ci/compose_probe.py \
            --compose-file docker-compose.minimal.yml \
            --services tool-gate memu-core memu-core-introspect \
            --timeout 120
          python3 scripts/ci/compose_probe.py \
            --compose-file docker-compose.minimal.yml \
            --services agentic \
            --timeout 300

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "── disk ────────────────────────────────────────────────"
          df -h / /var/lib/docker 2>&1 || true
          echo "── does the compose file even parse? ───────────────────"
          docker compose -f docker-compose.minimal.yml config -q \
            && echo "compose config: valid" \
            || echo "compose config: INVALID (this is the cause)"
          echo "── containers, including stopped ───────────────────────"
          docker compose -f docker-compose.minimal.yml ps -a || true
          echo "── images present ──────────────────────────────────────"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true
          echo "── logs ────────────────────────────────────────────────"
          docker compose -f docker-compose.minimal.yml logs --no-color || true
      # Replaced on 2026-08-05. The previous script wrapped every probe
      # in a catch-all, printed "service X not reachable", and ended in
      # `return 0` — with the whole stack down it printed eleven failures
      # and passed. It was the one step whose job is to prove the system
      # runs, and it could not say no. It also carried its own map of
      # eleven localhost ports, five of them naming services absent from
      # this profile and none of them reachable since the edge lockdown
      # put tool-gate, memu-core and agentic on internal-only networks.
      #
      # The replacement reads health from `docker compose ps` — the
      # verdict of the healthcheck each service already declares — and
      # exercises endpoints through `docker compose exec`, inside the
      # network, with ports derived from those same healthchecks.
      - name: Live smoke against the running stack
        run: |
          python3 scripts/ci/live_smoke.py \
            --compose-file docker-compose.minimal.yml
      - name: Kill-isolation — introspect crash must not affect hot path
        run: |
          # Every probe here used to be `curl http://localhost:8001|8009`,
          # aimed at host ports that have not existed since the edge
          # lockdown. The calls now run inside the containers, with the
          # port read from each service's own healthcheck.
          C=docker-compose.minimal.yml
          docker compose -f $C stop memu-core-introspect
          python3 scripts/ci/kill_isolation.py --compose-file $C
          docker compose -f $C start memu-core-introspect
          python3 scripts/ci/compose_probe.py \
            --compose-file $C --services memu-core-introspect --timeout 90
          echo "OK: memu-core-introspect recovered"

      - name: Restart-persistence smoke test — memory survives memu-core restart
        env:
          MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
        run: |
          python3 scripts/test_restart_persistence.py \
            --compose-file docker-compose.minimal.yml \
            --service memu-core

      - name: Tear down minimal stack
        if: always()
        run: |
          docker compose -f docker-compose.minimal.yml down

      - name: Bring up memu-graph (Cognee/Kuzu live verification)
        env:
          # D49/D51: qwen2.5:0.5b is too small to reliably produce valid
          # structured JSON under Cognee's instructor/Pydantic validation
          # (acreate_structured_output) — failures there surface as a
          # misleading "LLM connection test timed out" even though Ollama
          # itself responds 200 OK promptly. qwen2.5:1.5b (D49) got past
          # invalid-JSON-syntax failures but still echoed the Response
          # schema's *description* back instead of filling it in (D51) —
          # syntactically valid JSON, semantically wrong. qwen2.5:3b is the
          # next step up. Override OLLAMA_MODEL just for this step/stack
          # (only ollama, ollama-pull, memu-graph are started here) so the
          # project-wide CPU-safe default in docker-compose.full.yml and
          # .env.example is untouched.
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          docker compose -f docker-compose.full.yml up -d ollama ollama-pull memu-graph
          # Was `curl http://localhost:8061`. memu-graph is on agent-net,
          # declared `internal: true`, so that address reached nothing.
          # ollama-pull is a one-shot job with no healthcheck, so it is
          # not waited on — only the two that declare one.
          python3 scripts/ci/compose_probe.py \
            --compose-file docker-compose.full.yml \
            --services ollama memu-graph \
            --timeout 300

      # ci-toleration: needs-owner
      - name: Run memu-graph live ingest/query/forget cycle (best-effort)
        run: |
          # Runs inside the container: memu-graph publishes no host port.
          # The script is stdlib-only now, so no pip install is needed in
          # an image that only has to answer HTTP to itself.
          #
          # This is live verification, which this programme is shortest
          # of, and it is currently allowed to fail every run. Declared
          # needs-owner so the skip is dated rather than permanent.
          if docker compose -f docker-compose.full.yml exec -T \
               memu-graph python - < scripts/test_graph_live.py; then
            echo "memu-graph live verification: PASSED"
            echo "### memu-graph live verification: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DID NOT VERIFY — memu-graph live cycle failed (Ollama model quality / extension.kuzudb.com)."
            echo "  This step proves nothing when it fails. Declared needs-owner, review by 2026-10-01."
            echo "### memu-graph live verification: DID NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump memu-graph logs (always, since the step above is best-effort)
        if: always()
        run: |
          docker compose -f docker-compose.full.yml ps
          docker compose -f docker-compose.full.yml logs ollama ollama-pull memu-graph --no-color

      - name: Tear down memu-graph stack
        if: always()
        run: |
          docker compose -f docker-compose.full.yml down

      - name: Boot sovereign profile (pgvector postgres + tool-gate + memu-core)
        env:
          MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
          DB_PASSWORD: localdev
        run: |
          # S4: First CI verification that the sovereign compose boots correctly.
          # Only start the three services that don't need Tailscale/Vault/Ollama.
          # memu-core with VECTOR_STORE=postgres validates the D79 pgvector image fix.
          docker compose -f docker-compose.sovereign.yml up -d postgres tool-gate memu-core
          # One wait for all three, on the healthchecks they already
          # declare. postgres has always been checked correctly here —
          # `exec -T postgres pg_isready` — and the other two were curled
          # on host ports this profile does not publish. Same treatment
          # for all three now, which is what that first line was already
          # showing the way to.
          python3 scripts/ci/compose_probe.py \
            --compose-file docker-compose.sovereign.yml \
            --services postgres tool-gate memu-core \
            --timeout 180
          echo "--- Sovereign boot health: all three healthy ---"

      - name: Dump sovereign logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.sovereign.yml ps
          docker compose -f docker-compose.sovereign.yml logs postgres tool-gate memu-core --no-color

      - name: Tear down sovereign stack
        if: always()
        run: |
          docker compose -f docker-compose.sovereign.yml down -v

      # Last on purpose. The dump step beside the bring-up ran and printed
      # exactly what was asked of it — and it was unreadable, because the
      # log API serves a fixed-size tail and the eleven teardown steps
      # after it emit forty "variable is not set" warnings each, which
      # pushed the answers out of the window. Twice.
      #
      # A diagnostic nobody can read is the same as no diagnostic, and
      # position in the file is what decides that here. Nothing runs after
      # this step but the runner's own cleanup, so this output is the tail.
      # stderr is dropped on the compose calls whose *stdout* is the
      # answer — that is the warning spam, not the error, and the error
      # has its own line below.
      # ci-toleration: documented-skip
      - name: Post-mortem (last, so it survives log truncation)
        if: failure()
        run: |
          echo "══════════ POST-MORTEM ══════════"
          echo "── disk ──"
          df -h / /var/lib/docker 2>&1 | head -5 || true
          echo "── minimal compose config parses? ──"
          docker compose -f docker-compose.minimal.yml config -q 2>&1 \
            && echo "config: VALID" || echo "config: INVALID"
          echo "── the minimal image build (its real output) ──"
          tail -25 /tmp/build-minimal.log 2>/dev/null || echo "(did not run)"
          echo "── the full image build (its real output) ──"
          tail -8 /tmp/build-full.log 2>/dev/null || echo "(did not run)"
          echo "── what the bring-up itself said (its real output) ──"
          tail -20 /tmp/bringup.log 2>/dev/null || echo "(did not run)"
          echo "── containers (all states) ──"
          docker compose -f docker-compose.minimal.yml ps -a 2>/dev/null \
            | head -12 || true
          echo "── images built ──"
          docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
            | head -8 || true
          echo "══════════ END POST-MORTEM ══════════"
