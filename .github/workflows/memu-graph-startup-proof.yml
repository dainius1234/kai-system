# KAI-GATE-048 — does `memu-graph` acquire a model BEFORE readiness?
#
# The one decision-changing measurement left in the A/B/C sweep (D186).
# `memu-graph`'s loader lives inside third-party cognee, so no source
# trace can establish its timing; that is the entire reason this job
# exists rather than another parser.
#
# THE BRING-UP IS THE ONE THIS REPOSITORY ALREADY DEFINES. The collector
# copies the command from core-tests.yml's "Bring up memu-graph" step,
# the same readiness probe and the same live cycle. Nothing about the
# startup route is invented here — only the observation around it.
#
# NO REMEDIATION. This job changes nothing: it snapshots the HuggingFace
# cache in the image, at readiness, and after the first request, and the
# differences are the chronology.
name: memu-graph model-startup chronology (KAI-GATE-048)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-rework-plan-pgvp35
    # EVERY INPUT THIS JOB READS. Commit 924a600 repaired a collector and
    # fired nothing, because the collector was absent from the filter of
    # the job that runs it. The list is the job's inputs; all of them
    # belong in it — including the compose file and the live cycle, whose
    # absence would make this measure a different system silently.
    paths:
      - .github/workflows/memu-graph-startup-proof.yml
      - scripts/security/collect_memu_graph_startup.sh
      - scripts/security/summarise_memu_graph_startup.py
      - scripts/security/classify_model_startup.py
      - scripts/ci/health_chronology.py
      - scripts/ci/compose_probe.py
      - scripts/test_graph_live.py
      - scripts/security/define_memu_graph_asset_contract.sh
      - scripts/security/summarise_asset_contract.py
      - scripts/security/accept_memu_graph_offline.sh
      - scripts/security/summarise_memu_graph_acceptance.py
      - memu-graph/bake_tokenizer.py
      - scripts/security/diagnose_graph_stall.sh
      - scripts/security/probe_graph_stall.py
      - scripts/security/summarise_graph_stall.py
      - scripts/security/measure_ingest_contract.sh
      - scripts/security/probe_ingest_contract.py
      - scripts/security/summarise_ingest_contract.py
      - scripts/security/capture_llm_contract.sh
      - scripts/security/probe_llm_contract.py
      - scripts/security/classify_llm_response.py
      - scripts/security/summarise_llm_contract.py
      # The calibration suites that GATE the jobs below. Each was run by
      # this workflow while absent from its own trigger, so a change that
      # weakened a gate would not have caused the workflow to run it.
      # Derived by diffing every path this file references against this
      # list — seven, not the one that was noticed (R4/R6).
      - scripts/test_asset_contract.py
      - scripts/test_cognify_result.py
      - scripts/test_graph_stall.py
      - scripts/test_ingest_contract.py
      - scripts/test_llm_contract.py
      - scripts/test_memu_graph_acceptance.py
      - scripts/test_model_startup_classifier.py
      - memu-graph/Dockerfile
      - memu-graph/requirements.txt
      - memu-graph/app.py
      - memu-graph/cognify_result.py
      - docker-compose.full.yml

permissions:
  contents: read

jobs:
  memu-graph-startup-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # core-tests.yml overrides this for its memu-graph step only (D49,
      # D51: the 0.5b default cannot produce valid structured JSON under
      # Cognee's validation). Same override here, for the same reason and
      # the same scope — this job starts nothing else.
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4

      - name: The classifier must pass its anti-collapse calibration first
        run: |
          # A verdict from an uncalibrated instrument is not evidence.
          # This runs BEFORE the measurement so a broken classifier stops
          # the job instead of decorating its output.
          python3 scripts/test_model_startup_classifier.py

      - name: Mint an ephemeral database password for this run
        run: |
          printf 'DB_PASSWORD=ci-ephemeral-%s\n' \
            "$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)" \
            >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          # The full-profile images do not fit beside the runner's
          # preinstalled toolchains. Same treatment core-tests.yml uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the memu-graph image
        run: |
          docker compose -f docker-compose.full.yml build memu-graph

      # ci-toleration: documented-skip
      - name: memu-graph startup chronology
        if: always()
        env:
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          bash scripts/security/collect_memu_graph_startup.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.full.yml down -v || true

      # LAST, deliberately. The Actions log API serves a fixed byte
      # window from the END of a job — measured at ~15.8KB — so a summary
      # printed early is a summary that may not exist. Run 1 of the
      # degradation proof lost its whole diagnosis to exactly this.
      - name: Evidence summary (printed last so it survives truncation)
        if: always()
        run: |
          echo "commit ${GITHUB_SHA}"
          echo
          cat memu-graph-startup.evidence 2>/dev/null \
            || echo "  (not executed = UNKNOWN, not clean)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-startup-evidence
          path: |
            memu-graph-startup.evidence
            stage-logs/
          if-no-files-found: warn

  # D189's authorised definition unit. Read-only: every stage is a
  # throwaway `docker run` from the already-built image. No compose
  # service is started, no profile activated, no network declaration
  # altered. Stage A deliberately has egress because "what does this
  # path fetch" cannot be answered by a container that cannot fetch —
  # stages B, C and D put the network back to `none`.
  memu-graph-asset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the memu-graph image
        run: docker compose -f docker-compose.full.yml build memu-graph

      # ci-toleration: documented-skip
      - name: Define the model asset contract
        if: always()
        run: bash scripts/security/define_memu_graph_asset_contract.sh

      # LAST, so it lands inside the Actions log's fixed byte window.
      - name: Evidence summary (printed last so it survives truncation)
        if: always()
        run: |
          echo "commit ${GITHUB_SHA}"
          echo
          cat memu-graph-asset-contract.evidence 2>/dev/null \
            || echo "  (not executed = UNKNOWN, not clean)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-asset-contract
          path: |
            memu-graph-asset-contract.evidence
            asset-stage-logs/
          if-no-files-found: warn

  # KAI-GATE-048 Phase 1 ACCEPTANCE. Unlike the two jobs above, this one
  # measures a REMEDIATED image. It is the only thing that can close the
  # finding: D191 says a green build is not the contract.
  #
  # Its capability check runs on the repo-defined INTENDED topology, with
  # `ollama` present, because memu-graph delegates embedding work to it.
  # Only the asset checks use `--network none`.
  memu-graph-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4

      - name: The acceptance verdict must pass its calibration first
        run: |
          # A verdict from an uncalibrated instrument is not evidence.
          python3 scripts/test_memu_graph_acceptance.py
          python3 scripts/test_asset_contract.py

      - name: Mint an ephemeral database password for this run
        run: |
          printf 'DB_PASSWORD=ci-ephemeral-%s\n' \
            "$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)" \
            >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the remediated memu-graph image
        run: docker compose -f docker-compose.full.yml build memu-graph

      # ci-toleration: documented-skip
      - name: Phase 1 acceptance
        if: always()
        env:
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: bash scripts/security/accept_memu_graph_offline.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.full.yml down -v || true

      - name: Evidence summary (printed last so it survives truncation)
        if: always()
        run: |
          echo "commit ${GITHUB_SHA}"
          echo
          cat memu-graph-acceptance.evidence 2>/dev/null \
            || echo "  (not executed = UNKNOWN, not clean)"

      # THE GATE. Separate from collection so this exit code is the
      # verdict, and so the registry's workflow parse can see what
      # enforces KAI-GATE-048's closure condition. Non-zero on NOT MET
      # and on INCOMPLETE alike: "we did not measure" must not read as
      # "it works".
      - name: KAI-GATE-048 Phase 1 verdict
        if: always()
        run: |
          python3 scripts/security/summarise_memu_graph_acceptance.py \
            --stage-logs acceptance-stage-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-acceptance
          path: |
            memu-graph-acceptance.evidence
            acceptance-stage-logs/
          if-no-files-found: warn

  # KAI-GATE-049 — DIAGNOSTIC ONLY. Nothing is remediated: no timeout is
  # raised in any shipped path, no model changed, memu-graph untouched,
  # scripts/test_graph_live.py untouched.
  #
  # It watches PAST the live cycle's 300s budget because that budget is
  # the number under investigation: runs 4 and 6 "reproduced" ~291s
  # because both used it, not because the system did the same thing
  # twice.
  memu-graph-stall-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4

      - name: The analyser must pass its calibration first
        run: python3 scripts/test_graph_stall.py

      - name: Mint an ephemeral database password for this run
        run: |
          printf 'DB_PASSWORD=ci-ephemeral-%s\n' \
            "$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)" \
            >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the memu-graph image
        run: docker compose -f docker-compose.full.yml build memu-graph

      # ci-toleration: documented-skip
      - name: Stage decomposition of the post-chunking silence
        if: always()
        env:
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: bash scripts/security/diagnose_graph_stall.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.full.yml down -v || true

      - name: Evidence summary (printed last so it survives truncation)
        if: always()
        run: |
          echo "commit ${GITHUB_SHA}"
          echo
          cat graph-stall.evidence 2>/dev/null \
            || echo "  (not executed = UNKNOWN, not clean)"

      # ci-toleration: documented-skip
      - name: Which stage owns the silence
        if: always()
        run: |
          python3 scripts/security/summarise_graph_stall.py \
            --stage-logs stall-stage-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-stall-diagnosis
          path: |
            graph-stall.evidence
            stall-stage-logs/
          if-no-files-found: warn

  # KAI-GATE-050 — MEASUREMENT ONLY. Opened from run 31733359906, where
  # cognee's pipeline failed 422 and /graph/ingest answered 200
  # {"status":"ingested"}. Nothing is remediated here: no timeout raised,
  # no model changed, memu-graph/app.py untouched, cognee untouched.
  #
  # Two CLEAN STACKS, not two requests: a second request against the same
  # stack shares cognee's databases and dataset, so it is a weaker
  # replication than it looks.
  memu-graph-ingest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4

      - name: The predicate and the analyser must pass calibration first
        run: |
          # The predicate is what memu-graph now uses to decide success.
          # An uncalibrated one would decorate a verdict, not make it.
          python3 scripts/test_cognify_result.py
          python3 scripts/test_ingest_contract.py

      - name: Mint an ephemeral database password for this run
        run: |
          printf 'DB_PASSWORD=ci-ephemeral-%s\n' \
            "$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)" \
            >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the memu-graph image
        run: docker compose -f docker-compose.full.yml build memu-graph

      # ci-toleration: documented-skip
      - name: Measure the /graph/ingest contract on two clean stacks
        if: always()
        env:
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: bash scripts/security/measure_ingest_contract.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.full.yml down -v || true

      - name: Evidence summary (printed last so it survives truncation)
        if: always()
        run: |
          echo "commit ${GITHUB_SHA}"
          echo
          cat ingest-contract.evidence 2>/dev/null \
            || echo "  (not executed = UNKNOWN, not clean)"

      # THE GATE. Separate from collection so this exit code is the
      # verdict. Non-zero on the finding AND on an unmeasured
      # observation alike: "we did not measure" must not read as "it
      # works".
      # ci-toleration: documented-skip
      - name: KAI-GATE-050 verdict — internal outcome vs external answer
        if: always()
        run: |
          python3 scripts/security/summarise_ingest_contract.py \
            --stage-logs contract-stage-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-ingest-contract
          path: |
            ingest-contract.evidence
            contract-stage-logs/
          if-no-files-found: warn

  # KAI-GATE-048 C — Q1/Q2/Q6 CAPTURE. OBSERVATION ONLY. No instructor
  # mode, model, timeout, retry, schema, cognee validation or topology
  # change. Stops after Q1/Q2/Q6 are measured; assigns no ownership.
  memu-graph-llm-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4

      # A real JSON Schema validator, so VALID INSTANCE can mean
      # "satisfies the captured schema" rather than "has the right
      # top-level keys". Without it the analyser is not broken — it
      # degrades to REQUIRED FIELDS PRESENT and says so — but the
      # strongest verdict becomes unreachable, and the calibration
      # refuses to certify a path it could not exercise.
      - name: Install the JSON Schema validator the analyser needs
        run: python3 -m pip install --quiet jsonschema

      - name: The classifier must pass its fitness calibration first
        run: |
          # If it cannot tell a schema definition from an instance of it,
          # it is not fit for this question and must not decorate a table.
          python3 scripts/test_llm_contract.py

      - name: Mint an ephemeral database password for this run
        run: |
          printf 'DB_PASSWORD=ci-ephemeral-%s\n' \
            "$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)" \
            >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the memu-graph image
        run: docker compose -f docker-compose.full.yml build memu-graph

      # ci-toleration: documented-skip
      - name: Capture the structured-output request and response
        if: always()
        env:
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: bash scripts/security/capture_llm_contract.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.full.yml down -v || true

      - name: Evidence summary (printed last so it survives truncation)
        if: always()
        run: |
          echo "commit ${GITHUB_SHA}"
          echo
          cat llm-contract.evidence 2>/dev/null \
            || echo "  (not executed = UNKNOWN, not clean)"

      # ci-toleration: documented-skip
      - name: Q1/Q2/Q6 — request, response, reproducibility
        if: always()
        run: |
          python3 scripts/security/summarise_llm_contract.py \
            --capture llm-contract-logs/capture.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-llm-contract
          path: |
            llm-contract.evidence
            llm-contract-logs/
          if-no-files-found: warn

  # KAI-GATE-048 C — RE-ANALYSIS OF EVIDENCE ALREADY CAPTURED.
  #
  # Run 17 crossed the raw-response boundary: five real production calls
  # were captured with their full `messages`, and D222 established that
  # each attempt's contract is carried inside its OWN system message. So
  # the evidence needed to answer Q2 already exists on disk — what failed
  # was the analyser, not the capture.
  #
  # This job therefore spends NO model time. It re-runs only the corrected
  # analyser against the stored artifact. Re-running the model because
  # re-running is easier would burn ~8 minutes of GPU-less inference to
  # re-collect bytes we already have.
  memu-graph-llm-reanalysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read          # to read a PREVIOUS run's artifact
    env:
      # The run whose raw evidence is being re-analysed. Named here rather
      # than discovered, because re-analysis must be reproducible against
      # a fixed body of evidence; a moving "latest" would silently change
      # the denominator between runs.
      REANALYSE_RUN_ID: "31821368040"
      REANALYSE_COMMIT: "f1fdf926b67f99bbef2a48c247b929ac593393c1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the JSON Schema validator the analyser needs
        run: python3 -m pip install --quiet jsonschema

      - name: The analyser must pass its calibration first
        run: python3 scripts/test_llm_contract.py

      # ci-toleration: documented-skip
      - name: Fetch the raw evidence captured by run ${{ env.REANALYSE_RUN_ID }}
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: memu-graph-llm-contract
          run-id: ${{ env.REANALYSE_RUN_ID }}
          github-token: ${{ github.token }}
          path: reanalysis

      - name: Re-analyse — NO model call
        run: |
          echo "re-analysing run ${REANALYSE_RUN_ID}, commit ${REANALYSE_COMMIT}"
          echo "this commit: ${GITHUB_SHA}"
          echo "the EVIDENCE is run ${REANALYSE_RUN_ID}'s; only the ANALYSER"
          echo "is this commit's. Any verdict below is about that run's"
          echo "captured bytes, not about this tree's runtime behaviour."
          echo
          CAP=reanalysis/llm-contract-logs/capture.jsonl
          if [ ! -f "$CAP" ]; then
            # I-1: a missing subject is not a clean result.
            echo "RE-ANALYSIS NOT PERFORMED: the artifact from run"
            echo "  ${REANALYSE_RUN_ID} was not retrievable, so there was no"
            echo "  evidence to analyse. Q2 remains UNMEASURED. This is an"
            echo "  availability failure, NOT a finding about the LLM."
            if [ -d reanalysis ]; then
              echo "  what WAS downloaded:"
              ls -R reanalysis | head -40
            else
              echo "  nothing was downloaded at all."
            fi
            exit 2
          fi
          echo "  capture: $(wc -c < "$CAP") bytes, $(grep -c . "$CAP") record(s)"
          python3 scripts/security/summarise_llm_contract.py --capture "$CAP"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memu-graph-llm-reanalysis
          path: reanalysis/
          if-no-files-found: warn
