# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

# `main` only was how a week of red went unseen: the branch the work
# happens on could not observe the one job that runs the test suite.
on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov pip-audit
        [ -f requirements.txt ] && pip install -r requirements.txt || true
        find . -maxdepth 3 -name requirements.txt -not -path './.venv/*' -not -path './_archive/*' -print0 | while IFS= read -r -d '' req; do
          echo "Installing $req"
          pip install -r "$req"
        done
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,_archive,__pycache__
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,_archive,__pycache__
    # ci-toleration: needs-owner
    - name: Dependency vulnerability scan
      run: |
        if pip-audit --desc; then
          echo "pip-audit: clean"
        else
          echo "::warning::SKIPPED ENFORCEMENT — pip-audit reported findings above."
          echo "  Declared needs-owner in scripts/security/check_ci_tolerations.py, review by 2026-10-01."
        fi
    - name: Test with pytest (with coverage gate)
      env:
        MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
        KAI_ISOLATION_REPORT: .isolation-report.json
      run: |
        PYTHONPATH=. pytest \
          -p scripts.security.isolation_plugin \
          --ignore=_archive --ignore=.venv \
          --ignore=scripts/test_dashboard.py \
          --ignore=scripts/test_dashboard_ui.py \
          --cov=common --cov=agentic --cov=memu-core --cov=letta-agent --cov=financial-awareness \
          --cov-report=term-missing \
          --cov-fail-under=60 \
          -q
    # A-05. Reads the report the run above produced rather than running
    # the suite twice. `if: always()` because a red suite is exactly when
    # a cross-file leak is most likely to be the reason.
    - name: Cross-file test isolation (A-05)
      if: always()
      run: |
        python3 scripts/security/check_test_isolation.py \
          --from-report .isolation-report.json

    - name: Test dashboard (needs CWD=dashboard/)
      run: |
        cd dashboard && PYTHONPATH=.. pytest ../scripts/test_dashboard.py ../scripts/test_dashboard_ui.py -q
