name: Policy-as-Code Checks

on:
  push:
    paths:
      - 'docker-compose*.yml'
      - 'scripts/security/**'
      - '.github/workflows/policy-checks.yml'
      # The suites this workflow runs are its inputs too; a change that
      # weakened one would otherwise not cause the workflow to run it.
      - 'scripts/test_capture_trigger_paths.py'
      - 'scripts/test_declared_prerequisites.py'
      - 'scripts/test_doctrine_integrity.py'
      - 'scripts/test_image_identity.py'
      - 'scripts/test_item8_instruments.py'
      - 'kai-pm/DECISIONS.md'
      - 'kai-pm/ENGINEERING_DOCTRINE.md'
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'scripts/security/**'

jobs:
  policy:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 360 minutes; a hung job burns six
    # hours and reads as "still running". Run 697 of core-tests sat at
    # 133.9 minutes and finished with no conclusion at all. 60 is over
    # twice the longest successful run of any workflow here, so it
    # cannot cut short work that is progressing. All nine jobs were
    # unbounded — the bound is applied to the whole set, not to the one
    # workflow whose change prompted it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # The same install the main workflow does, not a hand-written
        # subset. `pip install pyyaml` was enough for the checks' own
        # imports but not for `check_architecture_rules`, which IMPORTS
        # THE MODULES IT INSPECTS — those need pydantic. Rules 7 and 11
        # could not run, the check correctly refused to certify what it
        # could not verify, and this workflow failed **30 runs out of 30
        # going back to 2026-08-03 without a single success**.
        #
        # Same shape as every other list-beside-the-thing this week: a
        # dependency list written next to the job, drifting from what the
        # job actually needs. Derived from the tree now.
        run: |
          pip install --upgrade pip
          pip install pyyaml
          find . -maxdepth 3 -name requirements.txt -not -path './.venv/*' -not -path './_archive/*' -print0 | while IFS= read -r -d '' req; do
            echo "Installing $req"
            pip install -r "$req"
          done

      # D251. The trigger check answers "changed paths ∩ live-capture
      # trigger paths = ∅" before a push. Its calibration runs HERE so a
      # suite that has stopped being able to fail is caught by a gate,
      # rather than by nobody: the check itself is author-invoked, and an
      # author-invoked check with an unproven calibration is a comfort.
      - name: Live-capture trigger check calibration
        run: python scripts/test_capture_trigger_paths.py

      # D268. `nothing is true because it was true last time`, in its one
      # decidable form. The report itself is not enforcing yet -- it has
      # open findings awaiting judgement -- but its calibration runs here
      # so the instrument cannot quietly stop being able to fail while
      # those findings are still open.
      - name: Declared-prerequisite gate calibration
        run: python scripts/test_declared_prerequisites.py

      # D272 / rule 28. Two records of the same 27 rules diverged and the
      # casualty was rule 4, the anti-drift rule. This publishes the
      # fingerprint an external copy must reproduce, and fails on a gap,
      # a duplicate or a rule with no recorded provenance.
      - name: Doctrine integrity and fingerprint
        run: python scripts/security/check_doctrine_integrity.py

      - name: Doctrine integrity gate calibration
        run: python scripts/test_doctrine_integrity.py

      # D278 / D247 §6 item 10. The collector itself runs only in
      # stage1-replay.yml, where a Docker daemon exists; its ability to
      # REFUSE -- rather than write an empty identity -- is proven here,
      # on every push, so it cannot quietly lapse between experiments.
      - name: Image-identity collector calibration
        run: python scripts/test_image_identity.py

      # D288. The frozen Item-8 design must not drift between the
      # freeze and the experiment, and the drift would be invisible
      # without this. Runs on every push, not only when Item 8 runs.
      - name: Item-8 frozen design integrity
        run: python scripts/security/check_item8_design.py

      - name: Item-8 instrument calibration
        run: python scripts/test_item8_instruments.py

      - name: Port binding check
        run: python scripts/security/check_port_bindings.py

      - name: Default profile check
        run: python scripts/security/check_default_profiles.py

      - name: Secret fallback check
        run: python scripts/security/check_secret_fallbacks.py
      - name: Every auth-enforcing service has its token
        run: python scripts/security/check_service_tokens.py

      - name: Network zone segmentation
        run: python scripts/security/check_network_zones.py

      - name: TurboVec single-writer
        run: python scripts/security/check_turbovec_writers.py

      - name: Restart and recovery containment
        run: python scripts/security/check_restart_recovery.py

      - name: Image tag mutability
        run: python scripts/security/check_image_tags.py

      - name: Compose drift detection
        run: python scripts/security/check_compose_drift.py
      - name: Architecture dependency rules
        run: python scripts/security/check_architecture_rules.py

      # Ratchet, not a threshold: fails only if the debt has grown. See
      # kai-pm/W1_GLOBAL_HYGIENE_SUBPLAN.md for why it starts non-zero.
      - name: HTTP and time hygiene ratchet
        run: python scripts/security/hygiene_survey.py --gate

      # A-04e: partial enforcement by design. I-4 (declaration
      # consistency) is at zero and enforced; I-1/I-2/I-3 are reported
      # while the retrofit proceeds. An invariant that reaches zero and
      # is not added to ENFORCED fails this gate — the ratchet advances
      # itself rather than waiting to be remembered.
      # A CI step that can pass without doing its job must be declared.
      - name: CI toleration register
        run: python scripts/security/check_ci_tolerations.py

      # This step had a `- name:` and no body. A step with neither `run`
      # nor `uses` is schema-invalid, so GitHub rejected the whole file,
      # scheduled **no jobs at all**, and every run of this workflow
      # completed as `failure` in zero seconds having executed nothing.
      #
      # It went unseen because the failure looks like any other red
      # workflow, and because I was watching core-tests.yml and calling
      # it "CI" — one workflow out of nine. The programme's own finding,
      # aimed at how I was watching rather than at what I was watching:
      # a scope smaller than the claim.
      #
      # The step's name is `Test wiring — no test defined and never
      # called`. It was never called.
      - name: Test wiring — no test defined and never called
        run: python scripts/security/check_test_wiring.py

      - name: Every jq filter embedded in a workflow compiles
        run: python scripts/security/check_workflow_filters.py

      - name: No $GITHUB_OUTPUT heredoc is bounded by a constant
        run: python scripts/security/check_workflow_outputs.py

      - name: Dockerfile instruction flags are hyphenated
        run: python scripts/security/check_dockerfile_flags.py

      - name: Every Dockerfile is built by a profile or declared
        run: python scripts/security/check_dockerfile_coverage.py

      - name: Every COPY source resolves in its build context
        run: python scripts/security/check_dockerfile_context.py

      - name: Every compose bring-up supplies the variables it needs
        run: python scripts/security/check_compose_env.py

      # This step had no `- name:` of its own, so its `run:` became a
      # second `run:` key on the step above. YAML keeps the last one:
      # the job showed "Every compose bring-up supplies the variables it
      # needs" and executed check_test_wiring.py. check_compose_env.py
      # has never run in CI, and the step that claimed to run it was
      # green every time.
      - name: Every test in a self-run suite is dispatched
        run: python scripts/security/check_test_wiring.py

      - name: Every `$` in a compose command reaches whoever wrote it
        run: python scripts/security/check_compose_interpolation.py

      - name: Every import binds on a path that reaches its uses
        run: python scripts/security/check_unreachable_bindings.py

      - name: Every implicit dependency is declared where it is used
        run: python scripts/security/check_implicit_deps.py

      - name: Every image contains the modules its entry point imports
        run: python scripts/security/check_image_modules.py

      - name: Every image installs what the packages it ships import
        run: python scripts/security/check_shipped_package_deps.py

      - name: Every healthcheck can run in the image it checks
        run: python scripts/security/check_healthcheck_runnable.py

      # A private signing key mounted into two services makes them ONE
      # principal, which is exactly the defect per-service identity was
      # built to remove — it would come back wearing a signature.
      - name: Every signing key has exactly one owner
        run: python scripts/security/check_service_identity_wiring.py

      # Docker CREATES a missing bind-mount source as an empty directory
      # rather than failing, so a machine-specific path boots healthy and
      # reads nothing. heartbeat scanned /var/log/sovereign for `timeout`,
      # `blocked` and `injection` and published 0 hits from a directory
      # that only ever existed on one laptop.
      - name: Every bind mount names a path that exists on any host
        run: python scripts/security/check_bind_mount_portability.py

      # Reported, not enforced: all 5 findings need a network-topology
      # decision, and network zones are policy with their own gate. It
      # exits 0 by design; that is declared in gate_registry.py as
      # kind=REPORT with pending_wiring naming what would promote it, so
      # a `ci-toleration` marker here would be the same fact in two
      # places — and two copies of one fact is the defect shape this
      # repository has spent a fortnight removing.
      - name: Peers named twice must be reachable (reported)
        run: python scripts/security/check_service_reachability.py

      # full.yml's sixteen bare `depends_on` lists were fixed and the
      # class was called closed. Eleven survived in minimal.yml and
      # sovereign.yml, in the same tree on the same day, because the fix
      # had a scope and nothing measured the class.
      - name: Every depends_on says what it waits for
        run: python scripts/security/check_depends_on_readiness.py

      - name: Every test pins the identity it claims to run as
        run: python scripts/security/check_test_identity.py

      - name: Instrumentation invariants (I-4 enforced)
        run: python scripts/security/check_gate_registry.py --gate
