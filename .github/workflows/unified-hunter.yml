name: Unified Hunter Suites

# The 26 suites behind `make test-uh` — contracts, perception spine, world
# state, autonomy, migration, and every Wave 1 remediation guard — ran
# nowhere in CI until this file existed. They were enforced only when
# somebody remembered to run them locally, which is the same defect the
# assertion-floor gate below exists to catch, one level up: a check that
# is never invoked is a check that has stopped checking.

# `main`-only was how a week of red went unseen in python-app.yml: the
# branch the work happens on could not observe the result. Same trigger,
# same blind spot, so the same fix. PRs still target main only.
on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  unified-hunter:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 360 minutes; a hung job burns six
    # hours and reads as "still running". Run 697 of core-tests sat at
    # 133.9 minutes and finished with no conclusion at all. 60 is over
    # twice the longest successful run of any workflow here, so it
    # cannot cut short work that is progressing. All nine jobs were
    # unbounded — the bound is applied to the whole set, not to the one
    # workflow whose change prompted it.
    timeout-minutes: 60
    env:
      MEMU_ALLOW_FAKE_EMBEDDINGS: "true"
      HMAC_ALLOW_DEV_SECRET: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 — the FULL history, not a fixed number.
          #
          # Depth 2 was set because scripts/test_item8_verdicts.py resolves
          # HEAD~1 to build an authority envelope for a parent that is not
          # the approved commit. `git rev-parse` echoes its argument back
          # on stdout when a revision is missing, so at depth 1 that
          # scenario silently measured a malformed envelope instead of the
          # property it names -- red here since cf84ac1 while passing
          # locally on a full clone. (R11, I-8)
          #
          # That fixed ONE instrument's history requirement and left the
          # class open (R6). scripts/test_bind_mount_portability.py
          # calibrates against a known answer read from the tree at
          # f50715b -- 398 commits back -- with `git show`. At depth 2 all
          # three of its reads return 128, the suite emits its explicit
          # "could not read f50715b … (rebase or shallow clone?)" failure,
          # and `make test-uh` halts there. Measured: depth 2 gives
          # 25 passed / 1 failed, a full clone gives 29 / 0. The 25 is the
          # exact count CI recorded.
          #
          # A depth number is a promise about how far back every present
          # and future calibration may look, kept in a file none of them
          # can see. Depth 0 removes the guess. The instruments are NOT
          # changed to need less history: an instrument that cannot read
          # its known answer must fail, and it still does. (D375 / RC-6)
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # `test-dashboard-ui-auth` drives the browser credential shim under
      # node; without it that suite vanishes, which the floor gate then
      # reports as a vanished suite rather than passing quietly.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same install as the other workflows, not a hand-written
          # subset. `pip install pyyaml` in policy-checks.yml was exactly
          # this shape and left that workflow red for 30 consecutive
          # runs, because a hand-listed set is true of what someone
          # remembered and false of everything added since.
          # `pytest` is here because `test-test-isolation` spawns a real
          # pytest subprocess to calibrate the isolation plugin against
          # pytest's own hook ordering. It was absent for one run, and
          # the symptom was seven assertions about the contents of a
          # report that was never written — none of which said "pytest
          # is not installed". No requirements.txt in the tree carries
          # it; core-tests.yml and python-app.yml install it explicitly
          # and this file did not.
          pip install pyyaml fastapi 'httpx<1' starlette pydantic pytest
          find . -maxdepth 3 -name requirements.txt -not -path './.venv/*' -not -path './_archive/*' -print0 | while IFS= read -r -d '' req; do
            echo "Installing $req"
            pip install -r "$req" || true
          done

      # The log alone is not evidence. `check_assertion_floors.py --from-log`
      # binds `status = 0` to a literal, so the branch that refuses to judge
      # an incomplete run has never executed on the path CI uses: on
      # 1009f31 the aggregate exited 2, `make` halted at prerequisite 61 of
      # 78, and the gate reported the five suites that never started as
      # `missing` — a run that stopped, rendered as a surface that eroded.
      # The evidence unit is LOG + AUTHORITATIVE PROCESS STATUS, so this
      # step records both. Nothing reads the status yet; the consumer is
      # W2.2. (WF-2)
      #
      # Every line below is load-bearing, and each was measured rather
      # than assumed. The shell is `/usr/bin/bash -e {0}` — errexit is on.
      #
      #   `status=0` before the pipeline: the green path must reach the
      #   printf with the variable defined.
      #
      #   `set -o pipefail`: `tee` exits 0. Without pipefail the recorded
      #   status is tee's, and a failing suite would be banked as a zero —
      #   the same fabrication this step exists to remove, moved one level
      #   upstream. Measured: 2 becomes 0.
      #
      #   `|| status=$?`: under errexit a failing pipeline ends the step
      #   at that line. Measured: without this, nothing after it runs and
      #   the status file is never written — on the only path that matters.
      #   It protects the aggregate pipeline and nothing else; a second
      #   `||` anywhere here would suppress a failure we need to see.
      #
      #   `exit "$status"`: recording evidence must not turn a red suite
      #   green. The step concludes with the aggregate's own code — 2 on
      #   1009f31 — exactly as it did before this change.
      - name: Unified Hunter suites
        run: |
          set -o pipefail
          status=0
          make test-uh 2>&1 | tee /tmp/test-uh.log || status=$?
          printf '%s\n' "$status" > /tmp/test-uh.log.status
          exit "$status"

      # A test run must leave the tree exactly as it found it. Until
      # 2026-08-05 it did not: `make test-uh` appended two signed,
      # hash-chained AUTONOMOUS_ACTION events to the repository's own
      # `data/trust-ledger/events.jsonl` on every run, and a full
      # `pytest scripts/` mutated four tracked files. Locally that was
      # invisible because `git checkout -- data/` had become a reflex.
      # This step is the thing that has no reflexes.
      - name: The suite must not write into the repository
        run: |
          if ! git diff --quiet; then
            echo "::error::The test run modified tracked files:"
            git diff --stat
            echo
            echo "State written during a test belongs under a temporary"
            echo "root, not in the tree. See common/data_paths.py —"
            echo "KAI_DATA_ROOT moves every adopting store at once."
            exit 1
          fi
          echo "clean: the suite left no tracked file modified"

      # Ratchet, not a threshold: fails when a suite exercises *less* than
      # its recorded floor, vanishes from the output, or reports a
      # different count depending on what else has run.
      # See kai-pm/W1_DASHBOARD_REMEDIATION_PLAN.md (A-02).
      - name: Assertion-count ratchet
        run: |
          python3 scripts/security/check_assertion_floors.py \
            --from-log /tmp/test-uh.log --determinism

      # ci-toleration: documented-skip
      - name: Report the surface that was exercised
        if: always()
        run: |
          python3 scripts/security/check_assertion_floors.py \
            --from-log /tmp/test-uh.log --json || true
