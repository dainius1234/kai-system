# No `version:` key. Compose has ignored it since v2 and warns about it on
# every single invocation — a signal that repeats forever is one nobody
# reads, and this one sat in the same logs as the warnings that mattered.

x-service-defaults: &service_defaults
  user: "1000:1000"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64M,noexec,nosuid
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 2G
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Profiles:
# - dev: local development with Vault dev server
# - default/no-profile: expects external Vault via VAULT_ADDR
services:
  postgres:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: pgvector/pgvector:pg15
    container_name: sovereign-postgres
    hostname: ledger-db
    networks:
      - data-net
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: keeper
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeper -d sovereign"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  tailscale:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["external-egress"]
    image: tailscale/tailscale:v1.78
    container_name: sovereign-tailscale
    hostname: sovereign-tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --ssh --accept-routes=true
      TS_HOSTNAME: sovereign-core
    # Same class as the executor's backoff loop, found by the gate that
    # defect produced. `TS_HOSTNAME: sovereign-core` is set four lines
    # above and nowhere else, so compose substituted `${TS_HOSTNAME}`
    # blank and this ran `tailscale up --hostname= …` — the node has
    # never been named what this file says it is named.
    #
    # `TS_AUTHKEY` did resolve, from `.env`, so that half worked. `$$` is
    # still the right spelling: it takes the value from the container's
    # environment instead of baking the auth key into a command line
    # that `docker compose config` and `ps` both render in the clear.
    command: sh -c "tailscaled --state=/var/lib/tailscale/tailscaled.state & sleep 2 && tailscale up --authkey=$$TS_AUTHKEY --hostname=$$TS_HOSTNAME --ssh --accept-routes=true && wait"
    networks:
      - egress-net


  vault:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["dev"]
    image: hashicorp/vault:1.18
    container_name: sovereign-vault
    hostname: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - ./vault-data:/vault/file
      - ./scripts/vault-init.sh:/vault/scripts/vault-init.sh:ro
    command: sh -c "vault server -dev -dev-root-token-id=${VAULT_ROOT_TOKEN} & sleep 3 && sh /vault/scripts/vault-init.sh && wait"
    networks:
      - control-net


  vault-rotator:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["dev"]
    image: hashicorp/vault:1.18
    container_name: sovereign-vault-rotator
    volumes:
      - ./scripts/vault-rotate.sh:/vault/scripts/vault-rotate.sh:ro
    environment:
      VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
    command: sh /vault/scripts/vault-rotate.sh
    depends_on:
      - vault
    networks:
      - control-net

  prometheus:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: prom/prometheus:v3.2.1
    container_name: sovereign-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    networks:
      - observability-net


  alertmanager:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: prom/alertmanager:v0.28.1
    container_name: sovereign-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - observability-net

  grafana:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: grafana/grafana:11.5
    container_name: sovereign-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    networks:
      - observability-net

  tool-gate:
    <<: *service_defaults
    build:
      context: .
      dockerfile: tool-gate/Dockerfile
    container_name: sovereign-tool-gate
    hostname: tool-gate
    networks:
      - control-net
      - data-net
      - execution-net
    volumes:
      - ./security/trusted_tokens.txt:/config/trusted_tokens.txt:ro
    environment:
      # Set explicitly rather than left to the code default. The
      # default is safe, but a reader of this file should be able
      # to see which tools require operator confirmation without
      # reading the service. n8n runs arbitrary workflows.
      IRREVERSIBLE_TOOLS_JSON: '{"destructive": ["shell", "n8n"], "financial": [], "public": []}'
      PG_URI: "postgresql://keeper:${DB_PASSWORD}@postgres:5432/sovereign"
      MODE: "PUB"
      REQUIRED_CONVICTION: "7.0"
      TRUSTED_TOKENS_PATH: "/config/trusted_tokens.txt"
      AUDIT_REDIS_URL: "redis://redis:6379"

    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  memu-core:
    <<: *service_defaults
    read_only: true
    build:
      context: .
      dockerfile: memu-core/Dockerfile
    container_name: sovereign-memu-core
    hostname: memu-core
    networks:
      - agent-net
      - data-net
    environment:
      # Declared so it can be *passed*. `MEMU_ALLOW_FAKE_EMBEDDINGS`
      # was set at step level by every CI bring-up and reached this
      # container in none of them: compose passes a variable only to
      # services that name it, and only `minimal` named it. memu-core
      # raises at import when sentence-transformers cannot load and
      # this is not true (app.py:1042), so the container died before
      # listening and compose reported only "is unhealthy".
      # Defaults to false, so a real deployment is unchanged.
      MEMU_ALLOW_FAKE_EMBEDDINGS: "${MEMU_ALLOW_FAKE_EMBEDDINGS:-false}"
      PG_URI: "postgresql://keeper:${DB_PASSWORD}@postgres:5432/sovereign"
      VECTOR_STORE: "postgres"
      API_HOST: "0.0.0.0"
      API_PORT: "8001"
      AUDIT_REDIS_URL: "redis://redis:6379"
      VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
      VAULT_TOKEN: "${VAULT_ROOT_TOKEN:-}"
    volumes:
      - memu_data:/data

    depends_on:
      - postgres
      - tool-gate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  memu-core-introspect:
    <<: *service_defaults
    read_only: true
    build:
      context: .
      dockerfile: memu-core/Dockerfile.introspect
    container_name: memu-core-introspect
    hostname: memu-core-introspect
    networks:
      - data-net
      - observability-net
    environment:
      # Declared so it can be *passed*. `MEMU_ALLOW_FAKE_EMBEDDINGS`
      # was set at step level by every CI bring-up and reached this
      # container in none of them: compose passes a variable only to
      # services that name it, and only `minimal` named it. memu-core
      # raises at import when sentence-transformers cannot load and
      # this is not true (app.py:1042), so the container died before
      # listening and compose reported only "is unhealthy".
      # Defaults to false, so a real deployment is unchanged.
      MEMU_ALLOW_FAKE_EMBEDDINGS: "${MEMU_ALLOW_FAKE_EMBEDDINGS:-false}"
      PG_URI: "postgresql://keeper:${DB_PASSWORD}@postgres:5432/sovereign"
      VECTOR_STORE: "postgres"
      AUDIT_REDIS_URL: "redis://redis:6379"
      VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
      VAULT_TOKEN: "${VAULT_ROOT_TOKEN:-}"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8009/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  executor:
    profiles: ["execution"]
    build:
      context: .
      dockerfile: executor/Dockerfile
    runtime: gvisor
    restart: on-failure
    container_name: executor
    hostname: executor
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:executor-aa
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    networks:
      - execution-net
    environment:
      # Required: its protected routes fail closed without it.
      KAI_SERVICE_TOKEN: "${KAI_SERVICE_TOKEN:-}"
      BACKOFF_SCHEDULE: "10 60 300"
      TOOL_GATE_URL: "http://tool-gate:8000"
      MEMU_URL: "http://memu-core:8001"
      EXECUTION_TIMEOUT: "30"
      MAX_OUTPUT_SIZE: "1048576"
      VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
      VAULT_TOKEN: "${VAULT_ROOT_TOKEN:-}"
      AUDIT_REDIS_URL: "redis://redis:6379"

    # `$$`, not `$`. Compose interpolates `$VAR` when it parses this file,
    # long before any shell sees it — so `$BACKOFF_SCHEDULE` and `$d`
    # were both substituted with the empty string (they are set in the
    # *container's* environment, which compose knows nothing about) and
    # the command reaching the shell was:
    #
    #     for d in ; do python app.py && exit 0 || sleep ; done; exec python app.py
    #
    # An empty `for` list runs its body zero times. The retry-with-
    # backoff this line exists to provide has never once retried; every
    # boot fell straight through to the bare `exec`. It announced itself
    # on every compose command in CI —
    #   The "BACKOFF_SCHEDULE" variable is not set. Defaulting to a blank string.
    #   The "d" variable is not set. Defaulting to a blank string.
    # — for as long as the line has existed. Directive 3.
    command: sh -c "set -e; for d in $$BACKOFF_SCHEDULE; do python app.py && exit 0 || sleep $$d; done; exec python app.py"
    depends_on:
      - tool-gate
      - memu-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/alive || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 300s


  dashboard:
    <<: *service_defaults
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sovereign-dashboard
    hostname: dashboard
    networks:
      - agent-net
      - control-net
      - edge-net
      - observability-net
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TOOL_GATE_URL: "http://tool-gate:8000"
      LEDGER_URL: "postgresql://keeper:${DB_PASSWORD}@postgres:5432/sovereign"
      MEMU_URL: "http://memu-core:8001"
      LANGGRAPH_URL: "http://agentic:8007"
      AGENTIC_INTROSPECT_URL: "http://agentic-introspect:8023"
      EXECUTOR_URL: "http://executor:8002"
      HEARTBEAT_URL: "http://heartbeat:8010"
      AUDIT_REDIS_URL: "redis://redis:6379"
      # Inbound gateway credentials (Wave 1 Track A). The dashboard
      # fails closed: without these it answers 503 on every route.
      KAI_DASHBOARD_TOKEN: "${KAI_DASHBOARD_TOKEN:-}"
      KAI_DASHBOARD_IDENTITY: "${KAI_DASHBOARD_IDENTITY:-keeper}"
      KAI_DASHBOARD_ROLE: "${KAI_DASHBOARD_ROLE:-operator}"

    depends_on:
      - tool-gate
      - memu-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  agentic:
    <<: *service_defaults
    build:
      context: .
      dockerfile: agentic/Dockerfile
    container_name: agentic
    hostname: agentic
    networks:
      - agent-net
      - control-net
    volumes:
      - ./data/self-emp:/data/self-emp:ro
    environment:
      KAI_SERVICE_TOKEN: "${KAI_SERVICE_TOKEN:-}"
      REDIS_URL: "redis://redis:6379"
      MEMU_URL: "http://memu-core:8001"
      TOOL_GATE_URL: "http://tool-gate:8000"
      AUDIT_REDIS_URL: "redis://redis:6379"
      MTD_START: "50000"
      VAT_THRESHOLD: "85000"
      MILEAGE_RATE: "0.45"
      SELF_EMP_ROOT: "/data/self-emp"
      INCOME_CSV: "/data/self-emp/Accounting/income.csv"
      EXPENSES_LOG: "/data/self-emp/Accounting/expenses.log"

    depends_on:
      - memu-core
      - tool-gate
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8007/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  agentic-introspect:
    profiles: ["introspection"]
    <<: *service_defaults
    build:
      context: .
      dockerfile: agentic/Dockerfile.introspect
    container_name: agentic-introspect
    hostname: agentic-introspect
    networks:
      - agent-net
    environment:
      MEMU_URL: "http://memu-core:8001"
      REDIS_URL: "redis://redis:6379"
      AGENTIC_CORE_URL: "http://agentic:8007"
    depends_on:
      - memu-core
      - redis
      - agentic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8023/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  redis:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: redis:7-alpine
    command: redis-server --appendonly yes --save ""
    container_name: sovereign-redis
    hostname: redis
    networks:
      - agent-net
      - data-net
      - observability-net


  perception-telegram:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["external-egress"]
    image: python:3.11-slim
    container_name: perception-telegram
    command: sh -c "pip install --no-cache-dir httpx && python /app/telegram.py"
    volumes:
      - ./perception:/app:ro
    environment:
      LANGGRAPH_URL: "http://agentic:8007/run"
      TELEGRAM_API: "http://telegram-bridge:9000"
      BRIDGE_SHARED_SECRET: "${BRIDGE_SHARED_SECRET:-}"
    networks:
      - agent-net
      - egress-net
    depends_on:
      - agentic

  heartbeat:
    <<: *service_defaults
    build:
      context: .
      dockerfile: heartbeat/Dockerfile
    container_name: sovereign-heartbeat
    hostname: heartbeat
    networks:
      - execution-net
      - observability-net
    volumes:
      - /var/log/sovereign:/var/log/sovereign:ro
    environment:
      TOOL_GATE_URL: "http://tool-gate:8000"
      MEMU_INTROSPECT_URL: "http://memu-core-introspect:8009"
      CHECK_INTERVAL: "60"
      ALERT_WINDOW: "300"
      EXECUTOR_LOG_PATH: "/var/log/sovereign/executor.log"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      AUDIT_REDIS_URL: "redis://redis:6379"
    depends_on:
      - memu-core
      - memu-core-introspect
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  camera-service:
    profiles: ["sensors"]
    <<: *service_defaults
    build:
      context: .
      dockerfile: perception/camera/Dockerfile
    container_name: camera-service
    hostname: camera-service
    networks:
      - sensor-net

  audio-service:
    profiles: ["sensors"]
    <<: *service_defaults
    build:
      context: .
      dockerfile: perception/audio/Dockerfile
    container_name: audio-service
    hostname: audio-service
    networks:
      - sensor-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8021/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  skill-hunter:
    <<: *service_defaults
    build:
      context: .
      dockerfile: skill-hunter/Dockerfile
    container_name: skill-hunter
    hostname: skill-hunter
    networks:
      - agent-net
    environment:
      PORT: "8045"
      SKILLS_DIR: "/data/skills"
    volumes:
      - memu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8045/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  house-doctor:
    <<: *service_defaults
    build:
      context: .
      dockerfile: house-doctor/Dockerfile
    container_name: house-doctor
    hostname: house-doctor
    networks:
      - agent-net
    environment:
      MEMU_URL: http://memu-core:8001
      NOTIFY_URL: http://notify-service:8031
    volumes:
      - memu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8046/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # TODO: enable GPU when core is stable.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama

  # TODO: enable GPU when core is stable.
  # tts-service:
  #   build: ./output/tts

volumes:
  postgres_data:
  tailscale_state:
  memu_data:

networks:
  agent-net:
    internal: true
    driver: bridge
  control-net:
    internal: true
    driver: bridge
  data-net:
    internal: true
    driver: bridge
  edge-net:
    driver: bridge
  egress-net:
    driver: bridge
  execution-net:
    internal: true
    driver: bridge
  observability-net:
    internal: true
    driver: bridge
  sensor-net:
    internal: true
    driver: bridge

